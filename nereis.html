<!DOCTYPE html>

<style>
/* 全画面Canvasの1画面ゲーム。配色は深海（紺・青緑・砂色・暖色照明）で固定 */
:root{--bg:#071421;--ink:#e9e2cf;--sand:#d9c7a0;--teal:#3f8f8a;--warm:#e8b877;--coral:#b5553f;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;background:var(--bg)}
</style>

<body>
<canvas id="c"></canvas>
<script>
'use strict';
const cv=document.getElementById('c'),g=cv.getContext('2d');
const fogCv=document.createElement('canvas'),fg=fogCv.getContext('2d');
const PI=Math.PI,TAU=PI*2;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
const FS='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif';
const FM='"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';
const C={ink:'#e9e2cf',sand:'#d9c7a0',sandD:'#a8946a',teal:'#3f8f8a',tealL:'#9cc9c0',navy:'#0c2233',deep:'#071421',warm:'#e8b877',coral:'#b5553f',coralL:'#d59a84',brass:'#b58d4e'};
function font(c,px,bold,serif){c.font=(bold?'700 ':'400 ')+px+'px '+(serif?FM:FS);}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function shade(hex,f){const n=parseInt(hex.slice(1),16),r=clamp(((n>>16)&255)*f,0,255)|0,gg=clamp(((n>>8)&255)*f,0,255)|0,b=clamp((n&255)*f,0,255)|0;return 'rgb('+r+','+gg+','+b+')';}
function wrap(c,s,mw){const out=[];let cur='';for(const ch of s){if(cur&&c.measureText(cur+ch).width>mw&&!'、。）」'.includes(ch)){out.push(cur);cur=ch;}else cur+=ch;}if(cur)out.push(cur);return out;}
const QS=new URLSearchParams(location.search);
const SPEED=Math.max(1,parseInt(QS.get('speed')||'1'));

/* ---------------- 基地の構造 ---------------- */
const T=44,MW=44,MH=30;
const ROOMS=[
 {id:'control',name:'制御室',x:3,y:2,w:8,h:6},
 {id:'lab',name:'研究室',x:17,y:1,w:10,h:6},
 {id:'o2',name:'酸素プラント',x:33,y:2,w:8,h:6},
 {id:'engine',name:'機関室',x:2,y:12,w:8,h:7},
 {id:'hall',name:'中央ホール',x:18,y:11,w:8,h:8},
 {id:'med',name:'医務室',x:34,y:12,w:8,h:7},
 {id:'storage',name:'貯蔵庫',x:4,y:22,w:9,h:6},
 {id:'obs',name:'観測ドーム',x:18,y:23,w:8,h:6},
 {id:'comms',name:'通信室',x:31,y:22,w:9,h:6}];
const CORR=[[21,7,2,4],[21,19,2,4],[10,14,8,2],[26,14,8,2],[11,4,6,2],[27,4,6,2],[5,8,2,4],[37,8,2,4],[6,19,2,3],[36,19,2,3],[13,25,5,2],[26,25,5,2]];
const FURN=[
 [4,2,6,1,'console'],[8,6,2,1,'desk'],
 [18,1,3,1,'bench'],[23,1,3,1,'bench'],[21,4,2,1,'bench'],
 [34,2,2,2,'tank'],[38,2,2,2,'tank'],[34,7,2,1,'planter'],
 [3,13,2,2,'turbine'],[3,16,2,2,'turbine'],[7,12,2,1,'panel'],
 [21,14,2,2,'table'],
 [39,13,2,1,'bed'],[39,15,2,1,'bed'],[39,17,2,1,'bed'],[35,12,2,1,'cabinet'],
 [4,23,2,2,'crate'],[10,22,3,1,'crate'],[9,27,2,1,'crate'],
 [21,26,2,2,'dish'],
 [32,22,3,1,'rack'],[38,22,2,1,'rack'],[33,26,2,1,'desk']];
const STATIONS=[
 {room:0,type:'wires',tx:5,ty:3,name:'配線の接続'},
 {room:0,type:'seq',tx:8,ty:3,name:'航路データの照合'},
 {room:1,type:'samples',tx:19,ty:2,name:'サンプルの仕分け'},
 {room:1,type:'fill',tx:24,ty:2,name:'試薬の充填'},
 {room:2,type:'valve',tx:36,ty:3,name:'バルブの調整'},
 {room:3,type:'valve',tx:5,ty:14,name:'冷却バルブの調整'},
 {room:3,type:'fill',tx:5,ty:17,name:'燃料の補給'},
 {room:5,type:'samples',tx:36,ty:13,name:'検体の仕分け'},
 {room:6,type:'seq',tx:11,ty:23,name:'在庫の照合'},
 {room:7,type:'sonar',tx:23,ty:27,name:'ソナーの調整'},
 {room:8,type:'wires',tx:33,ty:23,name:'通信線の接続'},
 {room:8,type:'sonar',tx:38,ty:23,name:'電波の同調'}];
const FIX={lights:{tx:8,ty:13,name:'機関室の配電盤'},o2:{tx:40,ty:5,name:'酸素プラントの制御盤'}};
const VENTS=[[4,6,0],[8,17,0],[8,24,0],[19,24,0],[26,2,1],[35,5,1],[35,17,1],[39,26,1]].map(v=>({tx:v[0],ty:v[1],ring:v[2],x:(v[0]+.5)*T,y:(v[1]+.5)*T}));
const HALL={x:22*T,y:15*T};
const grid=new Uint8Array(MW*MH).fill(3);      // 0 外殻 1 床 2 ガラス 3 海 4 設備
const roomOf=new Int8Array(MW*MH).fill(-1);
(function(){
  ROOMS.forEach((r,i)=>{for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++){grid[x+y*MW]=1;roomOf[x+y*MW]=i;}});
  CORR.forEach(c=>{for(let y=c[1];y<c[1]+c[3];y++)for(let x=c[0];x<c[0]+c[2];x++){if(grid[x+y*MW]!==1){grid[x+y*MW]=1;roomOf[x+y*MW]=-2;}}});
  FURN.forEach(f=>{for(let y=f[1];y<f[1]+f[3];y++)for(let x=f[0];x<f[0]+f[2];x++)grid[x+y*MW]=4;});
  const wk=(x,y)=>x>=0&&y>=0&&x<MW&&y<MH&&(grid[x+y*MW]===1||grid[x+y*MW]===4);
  const hull=[];
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){if(grid[x+y*MW]!==3)continue;let near=false,roomN=false;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(wk(x+dx,y+dy)){near=true;if(roomOf[(x+dx)+(y+dy)*MW]>=0)roomN=true;}
    if(near)hull.push([x,y,roomN]);}
  hull.forEach(h=>{grid[h[0]+h[1]*MW]=h[2]?0:2;});
  const gl=(x0,y0,x1,y1)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(grid[x+y*MW]===0)grid[x+y*MW]=2;};
  gl(19,29,24,29);gl(19,0,24,0);gl(1,14,1,16);gl(42,14,42,16);gl(6,28,10,28);gl(33,28,37,28);gl(5,1,8,1);gl(35,1,38,1);
})();
const tl=v=>Math.floor(v/T);
function tileAt(x,y){const tx=tl(x),ty=tl(y);return tx<0||ty<0||tx>=MW||ty>=MH?3:grid[tx+ty*MW];}
function roomAt(x,y){const tx=tl(x),ty=tl(y);if(tx<0||ty<0||tx>=MW||ty>=MH)return -2;const r=roomOf[tx+ty*MW];return r>=0?r:-2;}
const roomName=r=>r>=0?ROOMS[r].name:'通路';
function los(x0,y0,x1,y1){const d=Math.hypot(x1-x0,y1-y0),n=Math.ceil(d/9);for(let i=1;i<n;i++){const t=i/n;if(tileAt(x0+(x1-x0)*t,y0+(y1-y0)*t)===0)return false;}return true;}
const D4=[[1,0],[-1,0],[0,1],[0,-1]];
function findPath(sx,sy,ex,ey){
  const prev=new Int16Array(MW*MH).fill(-1),s=sx+sy*MW,e=ex+ey*MW,q=[s],dirs=shuffle(D4.slice());prev[s]=s;
  for(let h=0;h<q.length;h++){const c=q[h];if(c===e)break;const cx=c%MW,cy=(c/MW)|0;
    for(const d of dirs){const nx=cx+d[0],ny=cy+d[1];if(nx<0||ny<0||nx>=MW||ny>=MH)continue;const n=nx+ny*MW;if(grid[n]!==1||prev[n]>=0)continue;prev[n]=c;q.push(n);}}
  const out=[];let c=e;if(prev[c]<0)return out;while(prev[c]!==c){out.push(c);c=prev[c];}return out.reverse();
}
function canStand(x,y){const r=10;return tileAt(x-r,y-r)===1&&tileAt(x+r,y-r)===1&&tileAt(x-r,y+r)===1&&tileAt(x+r,y+r)===1;}
function moveC(c,dx,dy){if(canStand(c.x+dx,c.y))c.x+=dx;if(canStand(c.x,c.y+dy))c.y+=dy;}

/* ---------------- 画面と状態 ---------------- */
let W=0,H=0,DPR=1,FDT=0,SEA_T=0,hits=[];
const SUITS=[['ミナト','#cdb78c'],['カイリ','#b0604a'],['シオン','#3f8f8a'],['ナギサ','#4f6f9c'],['イソラ','#7c8f55'],['ホタル','#c8923f'],['ウシオ','#8a7396'],['サンゴ','#b9c2c0']];
const G={state:'title',rt:0,t:0,zoom:1,chars:[],bodies:[],sab:{type:null,timer:0,cd:25},light:1,fade:{a:1,dir:-1,cb:null,sp:2},banner:null,roomLbl:{r:-9,t:0},btnUses:1,mini:null,showMap:false,sabMenu:false,howto:-1,logT:0,flash:0,ctx:{}};
const joy={id:null,ox:0,oy:0,dx:0,dy:0};
const keys={};
let mapCv=null,ms=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,3);W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  fogCv.width=Math.ceil(W/3);fogCv.height=Math.ceil(H/3);
  G.zoom=clamp(Math.min(W,H)/450,.72,1.5);
  const want=clamp(Math.round(G.zoom*DPR*4)/4,1,1.5);
  if(want!==ms){ms=want;buildMap();}
}

/* ---------------- 潜水服の描画 ---------------- */
function drawSuit(c,x,y,col,o){
  o=o||{};const s=o.s||1,face=o.face||1,t=o.t||0,dead=o.dead||0,mv=o.moving&&!dead,ph=o.ph||0;
  const dk=shade(col,.62),lt=shade(col,1.16);
  c.save();c.translate(x,y);c.scale(s,s);
  if(o.ghost)c.globalAlpha*=.45;
  if(!o.noShadow){c.fillStyle='rgba(0,0,0,.34)';c.beginPath();c.ellipse(dead*face*14,0,11+dead*9,4+dead*1.5,0,0,TAU);c.fill();}
  if(dead){c.translate(0,-7*ease(dead));c.rotate(face*ease(dead)*PI/2);}
  const bob=dead?0:(mv?-Math.abs(Math.sin(ph))*1.7:Math.sin(t*2.2+(o.seed||0))*.7-(o.ghost?3+Math.sin(t*1.6)*2:0));
  const sw=mv?Math.sin(ph):0;
  c.lineWidth=1.1;c.strokeStyle='#0a1820';c.lineJoin='round';
  // 背面タンク
  c.fillStyle='#4f636a';rr(c,-face*13-3,-26+bob,6,15,3);c.fill();c.stroke();
  c.fillStyle=C.brass;c.fillRect(-face*13-1.5,-28+bob,3,2.5);
  // 脚と鉛の靴
  for(const sg of [-1,1]){const lift=Math.max(0,sg*sw)*3,lx=sg*4.6-3,sx=sg*sw*1.6;
    c.fillStyle=dk;rr(c,lx+sx,-11-lift,6,9,2);c.fill();c.stroke();
    c.fillStyle='#2b3940';rr(c,lx+sx-.8,-4-lift,7.6,4.6,1.8);c.fill();c.stroke();}
  // 腕
  for(const sg of [-1,1]){c.fillStyle=dk;c.beginPath();c.ellipse(sg*10.2,-18+bob-sg*sw*1.8,3,5.6,sg*.15,0,TAU);c.fill();c.stroke();
    c.fillStyle='#2b3940';c.beginPath();c.arc(sg*10.4,-13.4+bob-sg*sw*1.8,2.4,0,TAU);c.fill();}
  // 胴
  c.fillStyle=col;rr(c,-9,-26+bob,18,19,6);c.fill();c.stroke();
  c.fillStyle=dk;c.beginPath();c.moveTo(-8.4,-13+bob);c.lineTo(8.4,-13+bob);c.lineTo(8.4,-11+bob);c.quadraticCurveTo(8,-7.6+bob,3,-7.6+bob);c.lineTo(-3,-7.6+bob);c.quadraticCurveTo(-8,-7.6+bob,-8.4,-11+bob);c.closePath();c.fill();
  c.fillStyle='#6b5a3a';c.fillRect(-8.6,-15+bob,17.2,2.2);
  c.fillStyle=C.brass;c.fillRect(-1.6,-15.4+bob,3.2,3);
  c.fillStyle='#1b2e36';c.beginPath();c.arc(face*3.4,-20+bob,2.5,0,TAU);c.fill();
  c.strokeStyle=C.brass;c.lineWidth=.9;c.stroke();
  c.strokeStyle='#e9e2cf';c.lineWidth=.6;c.beginPath();c.moveTo(face*3.4,-20+bob);c.lineTo(face*3.4+1.3,-21.2+bob);c.stroke();
  // 襟とヘルメット
  c.strokeStyle='#0a1820';c.lineWidth=1.1;
  c.fillStyle=C.brass;rr(c,-8,-27.5+bob,16,4,2);c.fill();c.stroke();
  const hy=-33+bob;
  c.fillStyle=lt;c.beginPath();c.arc(0,hy,10,0,TAU);c.fill();c.stroke();
  c.fillStyle='rgba(255,255,255,.18)';c.beginPath();c.arc(-3,hy-4,5,0,TAU);c.fill();
  // 面ガラス
  const vx=face*3.2,vg=c.createLinearGradient(0,hy-5,0,hy+6);vg.addColorStop(0,dead?'#0d171c':'#17414c');vg.addColorStop(1,dead?'#182429':'#2f777a');
  c.fillStyle=vg;c.beginPath();c.ellipse(vx,hy+.6,6.2,5.2,0,0,TAU);c.fill();
  c.strokeStyle=C.brass;c.lineWidth=1.6;c.stroke();
  if(dead){c.strokeStyle='rgba(233,226,207,.7)';c.lineWidth=.7;c.beginPath();c.moveTo(vx-3,hy-3);c.lineTo(vx,hy);c.lineTo(vx-1,hy+3);c.moveTo(vx,hy);c.lineTo(vx+3.5,hy+1);c.stroke();}
  else{c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=1.1;c.beginPath();c.arc(vx,hy+.6,4,PI*1.1,PI*1.5);c.stroke();}
  c.fillStyle=C.brass;c.beginPath();c.arc(-face*8.3,hy+1,1.7,0,TAU);c.fill();
  c.fillStyle=dead?'#5d5545':C.warm;c.beginPath();c.arc(0,hy-10,1.9,0,TAU);c.fill();
  c.restore();
}

/* ---------------- 基地の事前描画 ---------------- */
function buildMap(){
  mapCv=document.createElement('canvas');mapCv.width=MW*T*ms;mapCv.height=MH*T*ms;
  const c=mapCv.getContext('2d');c.scale(ms,ms);
  let seed=11;const sr=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const at=(x,y)=>x<0||y<0||x>=MW||y>=MH?3:grid[x+y*MW];
  const wk=v=>v===1||v===4;
  // 床
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const v=grid[x+y*MW];if(!wk(v))continue;
    const X=x*T,Y=y*T,r=roomOf[x+y*MW],id=r>=0?ROOMS[r].id:'corr',alt=(x+y)&1;
    const tile=(a,b,line)=>{c.fillStyle=alt?a:b;c.fillRect(X,Y,T,T);c.strokeStyle=line;c.lineWidth=1;c.strokeRect(X+.5,Y+.5,T-1,T-1);};
    if(id==='hall'){tile('#a59469','#b09f76','rgba(60,45,20,.28)');c.fillStyle='rgba(60,45,20,.12)';c.fillRect(X+T/2-3,Y+T/2-3,6,6);}
    else if(id==='lab'){tile('#778c88','#839893','rgba(10,25,30,.22)');}
    else if(id==='med'){tile('#869a97','#92a5a0','rgba(10,25,30,.2)');c.strokeStyle='rgba(10,25,30,.1)';c.beginPath();c.moveTo(X+T/2,Y);c.lineTo(X+T/2,Y+T);c.moveTo(X,Y+T/2);c.lineTo(X+T,Y+T/2);c.stroke();}
    else if(id==='control'||id==='comms'){c.fillStyle=id==='control'?'#22434e':'#283853';c.fillRect(X,Y,T,T);for(let i=0;i<9;i++){c.fillStyle=i%2?'rgba(255,255,255,.045)':'rgba(0,0,0,.09)';c.fillRect(X+sr()*(T-2),Y+sr()*(T-2),2,2);}
      c.strokeStyle='rgba(217,199,160,.07)';c.strokeRect(X+.5,Y+.5,T-1,T-1);}
    else if(id==='o2'){c.fillStyle='#36575a';c.fillRect(X,Y,T,T);c.strokeStyle='rgba(0,0,0,.2)';c.lineWidth=1;c.beginPath();for(let i=0;i<=T;i+=7.33){c.moveTo(X+i,Y);c.lineTo(X+i,Y+T);c.moveTo(X,Y+i);c.lineTo(X+T,Y+i);}c.stroke();c.strokeStyle='rgba(180,220,210,.12)';c.strokeRect(X+.5,Y+.5,T-1,T-1);}
    else if(id==='engine'){c.fillStyle=alt?'#394148':'#3e474e';c.fillRect(X,Y,T,T);c.strokeStyle='rgba(0,0,0,.35)';c.strokeRect(X+.5,Y+.5,T-1,T-1);c.fillStyle='rgba(255,255,255,.13)';for(const p of [[5,5],[T-5,5],[5,T-5],[T-5,T-5]]){c.beginPath();c.arc(X+p[0],Y+p[1],1.4,0,TAU);c.fill();}
      c.strokeStyle='rgba(255,255,255,.04)';c.beginPath();for(let i=10;i<T;i+=8){c.moveTo(X+i,Y+12);c.lineTo(X+i+6,Y+T-12);}c.stroke();}
    else if(id==='storage'){for(let i=0;i<4;i++){const sh=.88+sr()*.2;c.fillStyle=shade('#8a7553',sh);c.fillRect(X,Y+i*11,T,11);c.fillStyle='rgba(40,25,10,.3)';c.fillRect(X,Y+i*11,T,1);if(sr()<.5){c.fillRect(X+sr()*T,Y+i*11,1,11);}}}
    else if(id==='obs'){c.fillStyle=alt?'#1d3749':'#20394c';c.fillRect(X,Y,T,T);c.strokeStyle='rgba(156,201,192,.08)';c.strokeRect(X+.5,Y+.5,T-1,T-1);}
    else{c.fillStyle='#48585f';c.fillRect(X,Y,T,T);c.strokeStyle='rgba(0,0,0,.22)';c.strokeRect(X+.5,Y+.5,T-1,T-1);c.fillStyle='rgba(255,255,255,.05)';c.fillRect(X+4,Y+4,T-8,1);}
    if(sr()<.1){c.fillStyle='rgba(0,0,0,.07)';c.beginPath();c.ellipse(X+sr()*T,Y+sr()*T,9,5,sr()*3,0,TAU);c.fill();}
  }
  // 通路の誘導線
  c.strokeStyle='rgba(217,199,160,.4)';c.lineWidth=2;c.setLineDash([10,8]);
  CORR.forEach(k=>{c.beginPath();if(k[2]>k[3]){c.moveTo(k[0]*T+4,(k[1]+1)*T);c.lineTo((k[0]+k[2])*T-4,(k[1]+1)*T);}else{c.moveTo((k[0]+1)*T,k[1]*T+4);c.lineTo((k[0]+1)*T,(k[1]+k[3])*T-4);}c.stroke();});
  c.setLineDash([]);
  // 床の装飾
  c.strokeStyle='rgba(70,50,20,.35)';c.lineWidth=3;c.beginPath();c.arc(HALL.x,HALL.y,2.7*T,0,TAU);c.stroke();
  c.lineWidth=1;c.beginPath();c.arc(HALL.x,HALL.y,2.9*T,0,TAU);c.stroke();
  for(let i=0;i<8;i++){const a=i/8*TAU+PI/8;c.beginPath();c.moveTo(HALL.x+Math.cos(a)*1.5*T,HALL.y+Math.sin(a)*1.5*T);c.lineTo(HALL.x+Math.cos(a)*2.7*T,HALL.y+Math.sin(a)*2.7*T);c.stroke();}
  c.strokeStyle='rgba(217,199,160,.2)';for(let i=0;i<3;i++){c.lineWidth=i===1?4:1.5;c.beginPath();c.arc(22*T,27*T,(1.9+i*.42)*T,0,TAU);c.stroke();}
  // 部屋名の床表示
  c.textAlign='center';c.textBaseline='middle';

const fish=[],bub=[],snow=[];
(function(){for(let i=0;i<24;i++)fish.push({x:rnd(-400,MW*T+400),y:rnd(-300,MH*T+300),s:rnd(.7,1.7),v:rnd(12,34),d:Math.random()<.5?1:-1,dep:rnd(.5,.95),ph:rnd(9)});
  fish.push({x:300,y:760,s:8,v:8,d:1,dep:.4,ph:0,big:1});
  for(let i=0;i<28;i++)bub.push({x:Math.random(),y:Math.random(),r:rnd(1.2,4.2),v:rnd(.03,.09),ph:rnd(9)});
  for(let i=0;i<50;i++)snow.push({x:Math.random(),y:Math.random(),v:rnd(.004,.016)});})();
function drawSea(cx,cy,z){
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0e3448');gr.addColorStop(.55,'#0a2435');gr.addColorStop(1,'#06131f');g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.save();g.globalCompositeOperation='lighter';
  for(let i=0;i<5;i++){const w=50+i*16,x0=((i*.24+.03)*W+Math.sin(SEA_T*.25+i*1.7)*36-cx*.06)%(W+200)-60,sk=H*.35;const lg=g.createLinearGradient(0,0,0,H);lg.addColorStop(0,'rgba(120,190,190,.085)');lg.addColorStop(1,'rgba(120,190,190,0)');g.fillStyle=lg;
    g.beginPath();g.moveTo(x0,0);g.lineTo(x0+w,0);g.lineTo(x0+w*1.8+sk,H);g.lineTo(x0+sk-w*.4,H);g.closePath();g.fill();}
  g.restore();
  for(const f of fish){f.x+=f.v*f.d*FDT;if(f.x>MW*T+600)f.x=-600;if(f.x<-600)f.x=MW*T+600;
    const sx=W/2+(f.x-cx)*z*f.dep,sy=H/2+(f.y-cy)*z*f.dep,m=30*f.s*z;if(sx<-m||sx>W+m||sy<-m||sy>H+m)continue;
    g.save();g.translate(sx,sy+Math.sin(SEA_T*.8+f.ph)*4);g.scale(f.d*f.s*z,f.s*z);
    g.fillStyle=f.big?'rgba(7,24,36,.6)':'rgba('+(22+f.dep*26|0)+','+(66+f.dep*40|0)+','+(84+f.dep*36|0)+','+(.4+f.dep*.45)+')';
    const wg=Math.sin(SEA_T*(f.big?1.4:5)+f.ph)*3;
    g.beginPath();g.moveTo(12,0);g.quadraticCurveTo(4,-5.2,-8,-1.2);g.lineTo(-17,-5.5+wg*.5);g.lineTo(-14.5,wg*.25);g.lineTo(-17,5.5+wg*.5);g.lineTo(-8,1.2);g.quadraticCurveTo(4,5.2,12,0);g.fill();
    g.beginPath();g.moveTo(-1,-3.6);g.lineTo(4,-7.5);g.lineTo(5.5,-3.2);g.fill();g.restore();}
  g.fillStyle='rgba(200,225,225,.2)';for(const s of snow){s.y+=s.v*FDT;if(s.y>1)s.y=0;g.fillRect(((s.x*W-cx*.25)%W+W)%W,((s.y*H-cy*.25)%H+H)%H,1.3,1.3);}
  g.lineWidth=1;for(const b of bub){b.y-=b.v*FDT;if(b.y<-.05){b.y=1.05;b.x=Math.random();}const bx=((b.x*W-cx*.4+Math.sin(SEA_T*1.3+b.ph)*8)%W+W)%W,by=((b.y*H-cy*.4)%(H*1.1)+H*1.1)%(H*1.1);
    g.strokeStyle='rgba(180,222,222,.3)';g.beginPath();g.arc(bx,by,b.r,0,TAU);g.stroke();g.fillStyle='rgba(220,240,240,.3)';g.beginPath();g.arc(bx-b.r*.3,by-b.r*.3,b.r*.25,0,TAU);g.fill();}
}

const KCD=32;
const hyp=(c,x,y)=>Math.hypot(c.x-x,c.y-y);
const visR=c=>c.role==='crew'?lerp(92,240,G.light):240;
const canSee=(a,b)=>hyp(a,b.x,b.y)<visR(a)&&los(a.x,a.y-4,b.x,b.y-4);
function setBanner(txt,t){G.banner={txt,t,t0:t};}
function fadeTo(cb,sp){G.fade.dir=1;G.fade.cb=cb;G.fade.sp=sp||3;}
function taskStats(){let d=0,n=0;for(const c of G.chars)if(c.role==='crew')for(const t of c.tasks){n++;if(t.done)d++;}return{done:d,total:n};}
function newGame(){
  const order=shuffle([0,1,2,3,4,5,6,7]);
  G.chars=order.map((ci,i)=>({id:i,name:SUITS[ci][0],col:SUITS[ci][1],x:0,y:0,ox:rnd(-8,8),oy:rnd(-8,8),face:1,ph:0,moving:false,alive:true,role:'crew',isPlayer:i===0,tasks:[],path:[],goal:null,wait:0,killCd:0,seen:{},sawKill:null,sawVent:null,called:0,reportT:-1,reportBody:null,fixDelay:-1,ghostT:20,deadT:0,seed:rnd(9),lastRoom:4,ventT:0,huntT:0,ejected:false}));
  const sp=shuffle([0,1,2,3,4,5,6,7]).slice(0,2);
  const force=QS.get('role');if(force==='spy'&&!sp.includes(0))sp[0]=0;if(force==='crew'&&sp.includes(0)){sp[sp.indexOf(0)]=[1,2,3,4,5,6,7].find(i=>!sp.includes(i));}
  sp.forEach(i=>G.chars[i].role='spy');
  G.player=G.chars[0];
  for(const c of G.chars){c.tasks=shuffle(STATIONS.map((_,i)=>i)).slice(0,5).map(s=>({s,done:false}));c.killCd=c.isPlayer?15:rnd(35,55);}
  G.sus=G.chars.map(()=>G.chars.map(()=>rnd(0,8)));
  G.bodies=[];G.sab={type:null,timer:0,cd:28};G.light=1;G.btnUses=1;G.t=0;G.mini=null;G.showMap=false;G.sabMenu=false;G.ending=false;G.win=null;G.M=null;G.banner=null;G.flash=0;G.roomLbl={r:-9,t:0};G.logT=0;
  placeInHall();
}
function placeInHall(){const al=G.chars.filter(c=>c.alive);al.forEach((c,i)=>{const a=i/al.length*TAU+.4;c.x=HALL.x+Math.cos(a)*108;c.y=HALL.y+Math.sin(a)*108;c.path=[];c.goal=null;c.wait=rnd(.4,2.4);c.reportT=-1;c.fixDelay=-1;c.face=c.x<HALL.x?1:-1;c.moving=false;});}
function checkWin(){
  if(G.ending)return true;
  const sp=G.chars.filter(c=>c.alive&&c.role==='spy').length,cr=G.chars.filter(c=>c.alive&&c.role==='crew').length;
  if(sp===0){endGame('crew','工作員は全員、基地から追放された');return true;}
  if(cr<=sp){endGame('spy','研究員は基地を守りきれなかった');return true;}
  const ts=taskStats();if(ts.done>=ts.total){endGame('crew','すべての任務が完了し、基地は守られた');return true;}
  return false;
}
function endGame(w,why){if(G.ending)return;G.ending=true;G.win={w,why};G.mini=null;G.showMap=false;G.sabMenu=false;joy.id=null;joy.dx=joy.dy=0;fadeTo(()=>{G.state='result';G.rt=0;G.M=null;},1.1);}
function startSab(type){
  const s=G.sab;if(s.type||G.ending)return;s.type=type;s.cd=40;s.timer=45;const f=FIX[type],fx=(f.tx+.5)*T,fy=(f.ty+.5)*T;
  G.chars.filter(c=>c.alive&&!c.isPlayer&&c.role==='crew').sort((a,b)=>hyp(a,fx,fy)-hyp(b,fx,fy)).slice(0,type==='o2'?3:2).forEach((c,i)=>{c.fixDelay=rnd(3,7)+i*2+(type==='lights'?7:0);});
  setBanner(type==='lights'?'照明が停止した':'酸素濃度が低下している',3);
}
function fixSab(){G.sab.type=null;G.chars.forEach(c=>{c.fixDelay=-1;});setBanner('設備が復旧した',2.5);}
function doKill(k,v){
  v.alive=false;v.deadT=0;k.killCd=k.isPlayer?KCD:KCD+rnd(20,35);
  const b={x:v.x,y:v.y,id:v.id,face:v.face,ign:{},room:roomAt(v.x,v.y),t:G.t,killer:k.id};G.bodies.push(b);
  for(const o of G.chars){if(!o.alive||o.role!=='crew')continue;if(canSee(o,k)){o.sawKill={k:k.id,v:v.id};G.sus[o.id][k.id]=100;if(!o.isPlayer){o.reportT=rnd(.5,1.2);o.reportBody=b;}}}
  if(v.isPlayer){G.mini=null;G.showMap=false;G.flash=1;setBanner('襲撃された。幽霊として任務は続けられる',4.5);}
  checkWin();
}
function ventWitness(c){for(const o of G.chars){if(o.alive&&o.role==='crew'&&canSee(o,c)){o.sawVent=c.id;G.sus[o.id][c.id]+=80;if(!o.isPlayer&&!o.called){o.goal=null;o.wait=0;}}}}
function useVent(c,vi){const v=VENTS[vi],ring=VENTS.filter(o=>o.ring===v.ring),n=ring[(ring.indexOf(v)+1)%ring.length];ventWitness(c);c.x=n.x;c.y=n.y;c.ventT=.6;c.path=[];ventWitness(c);}

/* ----- CPU ----- */
function setGoal(c,goal,ex,ey){c.goal=goal;c.path=findPath(tl(c.x),tl(c.y),ex,ey);c.wait=0;}
function wanderGoal(c){const r=pick(ROOMS);let x,y,n=0;do{x=r.x+(Math.random()*r.w|0);y=r.y+(Math.random()*r.h|0);}while(grid[x+y*MW]!==1&&++n<20);if(n>=20){x=20;y=13;}setGoal(c,{k:'wander'},x,y);}
function chooseGoal(c){
  if(c.role==='crew'){
    if(c.sawVent!=null&&G.chars[c.sawVent].alive&&!c.called){c.called=1;setGoal(c,{k:'button'},20,15);return;}
    const pend=[];c.tasks.forEach((t,i)=>{if(!t.done)pend.push(i);});
    if(pend.length&&Math.random()<.85){const i=pick(pend),s=STATIONS[c.tasks[i].s];setGoal(c,{k:'task',i},s.tx,s.ty);return;}
  }else{
    const r=Math.random();
    if(r<.5){const s=pick(STATIONS);setGoal(c,{k:'fake'},s.tx,s.ty);return;}
    if(r<.86){const cr=G.chars.filter(o=>o.alive&&o.role==='crew');if(cr.length){c.huntT=rnd(8,14);c.goal={k:'hunt',id:pick(cr).id,rt:0};c.path=[];c.wait=0;return;}}
  }
  wanderGoal(c);
}
function arrive(c){const k=c.goal?c.goal.k:'';
  if(k==='task')c.wait=rnd(5,9);else if(k==='fake')c.wait=rnd(2,5);else if(k==='fix')c.wait=2.5;
  else if(k==='button'){c.goal=null;startMeeting(c,null);}
  else if(k==='vent'){useVent(c,c.goal.v);c.goal=null;c.wait=.8;}
  else if(k==='hunt'){}
  else c.wait=rnd(.6,2.6);}
function finishGoal(c){const gl=c.goal;c.goal=null;if(!gl)return;
  if(gl.k==='task'&&c.role==='crew'){c.tasks[gl.i].done=true;checkWin();}
  if(gl.k==='fix'&&G.sab.type)fixSab();}
function follow(c,dt){
  if(!c.path.length){arrive(c);return;}
  const n=c.path[0],wx=(n%MW+.5)*T+c.ox,wy=((n/MW|0)+.5)*T+c.oy,dx=wx-c.x,dy=wy-c.y,d=Math.hypot(dx,dy),sp=112*dt;
  if(d<=sp){c.x=wx;c.y=wy;c.path.shift();}else{c.x+=dx/d*sp;c.y+=dy/d*sp;}
  c.moving=true;c.ph+=dt*11;if(Math.abs(dx)>1)c.face=dx>0?1:-1;
}
function spyThink(c,dt){
  if(c.killCd<=0){
    let v=null,bd=48;for(const o of G.chars){if(!o.alive||o.role!=='crew')continue;const d=hyp(o,c.x,c.y);if(d<bd&&los(c.x,c.y-4,o.x,o.y-4)){bd=d;v=o;}}
    if(v){let w=0;for(const o of G.chars){if(!o.alive||o.role!=='crew'||o===v)continue;if(canSee(o,c))w++;}
      if(w===0){doKill(c,v);if(G.ending)return true;
        let bv=null,b2=240;VENTS.forEach((ve,i)=>{const d=hyp(c,ve.x,ve.y);if(d<b2){b2=d;bv=i;}});
        if(bv!=null&&Math.random()<.6)setGoal(c,{k:'vent',v:bv},VENTS[bv].tx,VENTS[bv].ty);else wanderGoal(c);
        return true;}}
  }
  if(!G.sab.type&&G.sab.cd<=0&&Math.random()<dt*.05)startSab(Math.random()<.6?'lights':'o2');
  return false;
}
function botUpd(c,dt){
  if(G.state!=='play'||G.ending)return;
  if(!c.alive){if(c.role==='crew'){c.ghostT-=dt;if(c.ghostT<=0){c.ghostT=rnd(18,26);const t=c.tasks.find(t=>!t.done);if(t){t.done=true;checkWin();}}}return;}
  c.moving=false;
  if(c.reportT>0){c.reportT-=dt;if(c.reportT<=0){c.reportT=-1;startMeeting(c,c.reportBody);}return;}
  if(c.fixDelay>0){c.fixDelay-=dt;if(c.fixDelay<=0&&G.sab.type){const f=FIX[G.sab.type];setGoal(c,{k:'fix'},f.tx,f.ty);}}
  if(c.role==='spy'&&spyThink(c,dt))return;
  if(c.wait>0){c.wait-=dt;if(c.wait<=0)finishGoal(c);return;}
  if(!c.goal)chooseGoal(c);
  if(G.state!=='play')return;
  if(c.goal&&c.goal.k==='hunt'){c.huntT-=dt;c.goal.rt-=dt;const tg=G.chars[c.goal.id];if(c.huntT<=0||!tg.alive){c.goal=null;return;}
    if(c.goal.rt<=0){c.goal.rt=.7;c.path=findPath(tl(c.x),tl(c.y),tl(tg.x),tl(tg.y));}}
  follow(c,dt);
}
function logSight(){for(const a of G.chars){if(!a.alive)continue;a.lastRoom=roomAt(a.x,a.y);for(const b of G.chars){if(b===a||!b.alive)continue;if(canSee(a,b))a.seen[b.id]={room:roomAt(b.x,b.y),t:G.t};}}}
function detectBodies(){for(const c of G.chars){if(!c.alive||c.isPlayer||c.reportT>0)continue;for(const b of G.bodies){if(b.ign[c.id])continue;
  if(hyp(c,b.x,b.y)<visR(c)*.85&&los(c.x,c.y-4,b.x,b.y-4)){if(c.role==='spy'&&Math.random()>.12){b.ign[c.id]=1;continue;}c.reportT=rnd(.5,1.4);c.reportBody=b;break;}}}}

/* ----- プレイヤーの行動 ----- */
function ctxInfo(){const p=G.player,o={};if(G.ending||G.state!=='play')return o;
  if(p.alive){let bd=80;for(const b of G.bodies){const d=hyp(p,b.x,b.y);if(d<bd){bd=d;o.body=b;}}
    if(G.sab.type){const f=FIX[G.sab.type];if(hyp(p,(f.tx+.5)*T,(f.ty+.5)*T)<54)o.fix=G.sab.type;}
    else if(G.btnUses>0&&hyp(p,HALL.x,HALL.y)<94)o.button=true;
    if(p.role==='spy'){VENTS.forEach((v,i)=>{if(hyp(p,v.x,v.y)<36)o.vent=i;});let td=58;for(const c of G.chars){if(c.alive&&c.role==='crew'){const d=hyp(p,c.x,c.y);if(d<td&&los(p.x,p.y-4,c.x,c.y-4)){td=d;o.target=c;}}}}}
  if(p.role==='crew')p.tasks.forEach((t,i)=>{if(!t.done){const s=STATIONS[t.s];if(hyp(p,(s.tx+.5)*T,(s.ty+.5)*T)<48)o.task=i;}});
  return o;}
function act(kind){const p=G.player,o=G.ctx;if(G.state!=='play'||G.ending||G.fade.dir>0)return;
  if(kind==='report'&&o.body)startMeeting(p,o.body);
  else if(kind==='fix'&&o.fix)openMini(o.fix==='lights'?'switches':'code',{fix:true,name:o.fix==='lights'?'配電盤の復旧':'酸素制御盤の復旧'});
  else if(kind==='task'&&o.task!=null){const s=STATIONS[p.tasks[o.task].s];openMini(s.type,{task:o.task,name:s.name});}
  else if(kind==='button'&&o.button){G.btnUses--;startMeeting(p,null);}
  else if(kind==='kill'&&o.target&&p.killCd<=0)doKill(p,o.target);
  else if(kind==='vent'&&o.vent!=null)useVent(p,o.vent);
  else if(kind==='sab')G.sabMenu=!G.sabMenu;}
function mainKind(){const o=G.ctx;return o.body?'report':o.fix?'fix':o.task!=null?'task':o.button?'button':null;}
const KLBL={report:'通報',fix:'修理',task:'調べる',button:'招集',vent:'ダクト'};

function updPlay(dt){
  G.t+=dt;if(G.ending)return;const p=G.player;
  let mx=joy.dx/46,my=joy.dy/46;
  if(keys.ArrowLeft||keys.a)mx-=1;if(keys.ArrowRight||keys.d)mx+=1;if(keys.ArrowUp||keys.w)my-=1;if(keys.ArrowDown||keys.s)my+=1;
  let ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;ml=1;}
  if(G.mini||G.showMap){ml=0;}
  p.moving=ml>.15;if(p.moving){moveC(p,mx*120*dt,my*120*dt);p.ph+=dt*11;if(Math.abs(mx)>.2)p.face=mx>0?1:-1;}
  for(const c of G.chars){if(c.role==='spy'&&c.killCd>0)c.killCd-=dt;if(c.ventT>0)c.ventT-=dt;if(!c.alive)c.deadT+=dt;if(!c.isPlayer)botUpd(c,dt);if(G.state!=='play')return;}
  for(const b of G.bodies)b.age=(b.age||0)+dt;
  const s=G.sab;if(s.cd>0&&!s.type)s.cd-=dt;
  if(s.type==='o2'){s.timer-=dt;if(s.timer<=0){endGame('spy','酸素が尽き、基地は機能を失った');return;}}
  G.light=lerp(G.light,s.type==='lights'?0:1,1-Math.exp(-dt*3));
  G.logT-=dt;if(G.logT<=0){G.logT=.4;logSight();detectBodies();}
  if(G.mini){const m=G.mini;if(m.fix&&!G.sab.type&&!m.doneT)G.mini=null;else miniUpd(dt);}
  const r=roomAt(p.x,p.y);if(r!==G.roomLbl.r){G.roomLbl.r=r;if(r>=0)G.roomLbl.t=2.2;}if(G.roomLbl.t>0)G.roomLbl.t-=dt;
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}
  if(G.flash>0)G.flash-=dt*.8;
  G.ctx=ctxInfo();
}

/* ---------------- 会議 ---------------- */
function testimony(c,K){
  const al=G.chars.filter(o=>o.alive&&o!==c),nm=id=>G.chars[id].name;
  if(c.role==='crew'){
    if(c.sawKill&&G.chars[c.sawKill.k].alive)return{txt:nm(c.sawKill.k)+'が'+nm(c.sawKill.v)+'を襲うのを見た。',strong:c.sawKill.k};
    if(c.sawVent!=null&&G.chars[c.sawVent].alive)return{txt:nm(c.sawVent)+'が通気ダクトに出入りするのを見た。',strong:c.sawVent};
    if(K){const near=al.filter(o=>{const s=c.seen[o.id];return s&&s.room===K.room&&Math.abs(s.t-K.t)<9;});if(near.length){const o=pick(near);return{txt:'事件の頃、'+roomName(K.room)+'で'+o.name+'を見た。',soft:o.id};}}
    const rec=al.filter(o=>c.seen[o.id]&&G.t-c.seen[o.id].t<25).sort((a,b)=>c.seen[b.id].t-c.seen[a.id].t).slice(0,2);
    if(rec.length)return{txt:roomName(c.seen[rec[0].id].room)+'で'+rec.map(o=>o.name).join('と')+'を見かけた。',vouch:rec.map(o=>o.id)};
    return{txt:roomName(c.lastRoom)+'で一人で作業していた。'};
  }
  const crew=al.filter(o=>o.role==='crew'),r=Math.random();
  if(K&&r<.12&&crew.length){const o=pick(crew);return{txt:o.name+'が'+nm(K.id)+'を襲うのを見た。',strong:o.id};}
  if(K&&r<.55&&crew.length){const o=pick(crew);return{txt:'事件の頃、'+roomName(K.room)+'で'+o.name+'を見た。',soft:o.id};}
  const rm=pick(ROOMS.filter((q,i)=>!K||i!==K.room)),mate=r<.85&&al.length?pick(al):null;
  return mate?{txt:rm.name+'で'+mate.name+'を見かけた。',vouch:[mate.id]}:{txt:rm.name+'で一人で作業していた。'};
}
function botVote(c,al){const S=G.sus;
  if(c.role==='crew'){let b=-1,bs=34;for(const o of al){if(o===c)continue;if(S[c.id][o.id]>bs){bs=S[c.id][o.id];b=o.id;}}return b;}
  const judges=al.filter(o=>o.role==='crew'&&!o.isPlayer),pub=o=>{const js=judges.filter(j=>j!==o);return js.length?js.reduce((a,j)=>a+S[j.id][o.id],0)/js.length:0;};
  let b=-1,bs=22;for(const o of al){if(o===c)continue;const p=pub(o);if(o.role==='spy'){if(p>60&&Math.random()<.5)return o.id;continue;}if(p>bs){bs=p;b=o.id;}}
  if(b<0&&Math.random()<.3){const cr=al.filter(o=>o.role==='crew');if(cr.length)b=pick(cr).id;}return b;}
function startMeeting(rep,body){
  if(G.state!=='play'||G.ending)return;
  G.mini=null;G.showMap=false;G.sabMenu=false;joy.id=null;joy.dx=joy.dy=0;
  const al=G.chars.filter(c=>c.alive);
  const M=G.M={rep,body,t:0,phase:'intro',rows:G.chars.map(c=>({c,txt:'',te:null,votes:[]})),sel:null,order:[],shown:0,skips:[],ej:null,done:false};
  al.forEach(c=>{const te=testimony(c,body);M.rows[c.id].te=te;M.rows[c.id].txt=te.txt;});
  M.talk=al.map(c=>c.id);
  for(const i of al){if(i.isPlayer||i.role!=='crew')continue;const S=G.sus[i.id];
    for(const s of al){if(s===i)continue;const te=M.rows[s.id].te;
      if(te.strong!=null){if(te.strong===i.id)S[s.id]+=45;else S[te.strong]+=S[s.id]>=40?8:38;}
      else if(te.soft!=null){if(te.soft===i.id)S[s.id]+=10;else S[te.soft]+=15;}
      if(te.vouch)te.vouch.forEach(v=>{S[v]-=6;});}
    const own=M.rows[i.id].te;if(own.soft!=null)S[own.soft]+=18;
    for(const o of al)S[o.id]+=rnd(0,7);}
  M.votes={};al.forEach(c=>{if(!c.isPlayer)M.votes[c.id]=botVote(c,al);});
  G.sab.type=null;G.bodies=[];placeInHall();
  G.chars.forEach(c=>{if(c.role==='spy')c.killCd=Math.max(c.killCd,20);c.seen={};c.called=0;});
  G.state='meet';
}
function castVote(v){const M=G.M;if(!M||M.phase!=='vote')return;const p=G.player;
  if(p.alive)M.votes[p.id]=v;
  M.order=shuffle(Object.keys(M.votes).map(k=>({from:G.chars[+k],to:M.votes[k]})));M.phase='reveal';M.t=0;M.shown=0;}
function updMeet(dt){const M=G.M;if(!M)return;M.t+=dt;
  if(M.phase==='intro'){if(M.t>2.3){M.phase='talk';M.t=0;}}
  else if(M.phase==='talk'){if(M.t>M.talk.length*.55+.7){M.phase='vote';M.t=0;}}
  else if(M.phase==='reveal'){
    while(M.shown<M.order.length&&M.t>.4+M.shown*.32){const v=M.order[M.shown++];if(v.to>=0)M.rows[v.to].votes.push(v.from.col);else M.skips.push(v.from.col);}
    if(M.shown>=M.order.length&&M.t>.4+M.order.length*.32+1.3){
      const cnt={};let skip=0;M.order.forEach(v=>{if(v.to>=0)cnt[v.to]=(cnt[v.to]||0)+1;else skip++;});
      let top=-1,tc=0,tie=false;for(const k in cnt){if(cnt[k]>tc){tc=cnt[k];top=+k;tie=false;}else if(cnt[k]===tc)tie=true;}
      M.ej=(top>=0&&!tie&&tc>skip)?G.chars[top]:null;
      if(M.ej){M.ej.alive=false;M.ej.ejected=true;
        M.rows.forEach(r=>{if(r.te&&r.te.strong===M.ej.id)G.chars.forEach(i=>{if(i.role==='crew')G.sus[i.id][r.c.id]+=M.ej.role==='crew'?50:-30;});});}
      M.phase='eject';M.t=0;}}
  else if(M.phase==='eject'){if(M.t>4.4&&!M.done){M.done=true;if(!checkWin())fadeTo(()=>{G.state='play';G.M=null;G.ctx={};});}}
}

/* ---------------- ミニゲーム ---------------- */
const WC=['#cdb78c','#3f8f8a','#b0604a','#6f86ad'];
function panelBox(c,x,y,w,h){rr(c,x,y,w,h,8);c.fillStyle='#0a1d2a';c.fill();c.strokeStyle='rgba(217,199,160,.25)';c.lineWidth=1;c.stroke();}
const MINI={
 wires:{init(){return{right:shuffle([0,1,2,3]),conn:[0,0,0,0],drag:null};},

  dome(cx,by+24,R);dome(cx-R*2.1,by+30,R*.55);dome(cx+R*2.1,by+34,R*.6);
  g.strokeStyle='#22475a';g.lineWidth=2;g.beginPath();g.moveTo(cx,by+24-R);g.lineTo(cx,by+24-R-26);g.stroke();g.fillStyle='rgba(232,184,119,'+(.4+.6*Math.abs(Math.sin(SEA_T*1.6)))+')';g.beginPath();g.arc(cx,by+24-R-28,3,0,TAU);g.fill();
  const lg=g.createRadialGradient(cx,by+10,0,cx,by+10,R*2.4);lg.addColorStop(0,'rgba(232,184,119,.13)');lg.addColorStop(1,'rgba(232,184,119,0)');g.fillStyle=lg;g.fillRect(cx-R*2.4,by-R*2.4,R*4.8,R*4.8);
}
function drawTitle(){
  drawSea(960+Math.sin(SEA_T*.05)*300,640,1);
  const by=H*.74-Math.min(0,(H-520)*.2);drawBaseSilhouette(by);
  const vg=g.createLinearGradient(0,0,0,H*.5);vg.addColorStop(0,'rgba(4,11,20,.55)');vg.addColorStop(1,'rgba(4,11,20,0)');g.fillStyle=vg;g.fillRect(0,0,W,H*.5);
  const ts=Math.min(W*.105,56,H*.12),ty=Math.max(64,H*.2);
  label('正 体 隠 匿 ゲ ー ム',W/2,ty-ts*.95,Math.max(11,ts*.24),C.tealL,'center',true);
  g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=18;g.shadowOffsetY=4;label('深海基地ネレイス',W/2,ty,ts,C.sand,'center',true,true);g.shadowColor='transparent';g.shadowBlur=0;g.shadowOffsetY=0;
  g.fillStyle=C.sandD;g.fillRect(W/2-ts*2.4,ty+ts*.72,ts*4.8,1);
  label('八人の乗組員に、二人の工作員が紛れている',W/2,ty+ts*1.15,Math.max(12,Math.min(15,ts*.3)),C.ink);
  const sy=Math.min(H-150,by+40);[['#3f8f8a',-74,1],['#cdb78c',0,1],['#b0604a',74,-1]].forEach((s,i)=>drawSuit(g,W/2+s[1],sy+(i===1?6:0),s[0],{s:1.5,face:s[2],t:SEA_T,seed:i*2}));
  if(G.howto<0){const bw=Math.min(240,W-64),y=H-128;pill(W/2-bw/2,y,bw,54,'はじめる',()=>{if(G.fade.dir>0)return;fadeTo(()=>{newGame();G.state='role';G.rt=0;});},true);pill(W/2-bw/2,y+62,bw,48,'遊び方',()=>{G.howto=0;});}
  else drawHowto();
}
const HOWTO=[
 ['基地と役職',['深海基地ネレイスには八人の乗組員がいる。そのうち二人は、基地の破壊をねらう工作員。','研究員は、各部屋の装置で任務をすべて終えるか、会議で工作員を全員追放すれば勝ち。','工作員は、研究員を自分たちと同じ人数まで減らすか、酸素低下を時間切れまで放置させれば勝ち。']],
 ['操作',['画面の左側をドラッグすると移動する。','右下のボタンは状況で変わる。任務の装置では「調べる」、遺体の近くでは「通報」、中央ホールの卓では「招集」、妨害された設備では「修理」。','右上の「地図」で任務の場所を確かめられる。視界は自分の周りだけで、壁の向こうは見えない。']],
 ['会議と工作員',['会議では全員の目撃証言が並ぶ。工作員は嘘をつく。食い違いを手がかりに投票する。棄権もできる。','工作員になったら「襲撃」（待ち時間あり）、「妨害」（照明停止・酸素低下）、通気口での「ダクト」移動が使える。','襲撃やダクトの出入りを見られると証言される。人目のない場所を選ぶこと。']]];
function drawHowto(){
  g.fillStyle='rgba(3,9,16,.72)';g.fillRect(0,0,W,H);hits.push({x:0,y:0,w:W,h:H,cb:()=>{}});
  const pw=Math.min(W-24,480),ph=Math.min(H-24,470),x=(W-pw)/2,y=(H-ph)/2,pg=HOWTO[G.howto];
  rr(g,x,y,pw,ph,14);g.fillStyle='#0f2738';g.fill();g.strokeStyle=C.sandD;g.lineWidth=1.5;g.stroke();
  label(pg[0],x+22,y+32,19,C.sand,'left',true,true);label((G.howto+1)+' / '+HOWTO.length,x+pw-22,y+32,12,'rgba(233,226,207,.6)','right');
  g.fillStyle='rgba(217,199,160,.3)';g.fillRect(x+22,y+52,pw-44,1);
  let ty=y+78;const fs=H<430?12:14;font(g,fs);g.fillStyle=C.ink;g.textAlign='left';g.textBaseline='middle';
  pg[1].forEach(par=>{g.fillStyle=C.teal;g.fillRect(x+22,ty-5,3,10);g.fillStyle=C.ink;font(g,fs);wrap(g,par,pw-60).forEach(l=>{g.fillText(l,x+34,ty);ty+=fs*1.55;});ty+=fs*.6;});
  const bw=(pw-44-10)/2,byy=y+ph-64;
  pill(x+22,byy,bw,48,G.howto>0?'戻る':'閉じる',()=>{G.howto--;});
  pill(x+22+bw+10,byy,bw,48,G.howto<HOWTO.length-1?'次へ':'閉じる',()=>{G.howto=G.howto<HOWTO.length-1?G.howto+1:-1;},true);
}
function drawRole(){const p=G.player,t=G.rt,spy=p.role==='spy';
  drawSea(HALL.x,HALL.y,1);g.fillStyle='rgba(4,11,20,.72)';g.fillRect(0,0,W,H);
  const lg=g.createRadialGradient(W/2,H*.5,0,W/2,H*.5,Math.min(W,H)*.6);lg.addColorStop(0,spy?'rgba(181,85,63,.2)':'rgba(63,143,138,.22)');lg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=lg;g.fillRect(0,0,W,H);
  g.globalAlpha=ease(t/.6);label('あ な た の 役 職',W/2,H*.2,13,C.sand,'center',true);
  g.globalAlpha=ease((t-.5)/.7);const fs=Math.min(64,W*.16,H*.16);label(spy?'工作員':'研究員',W/2,H*.2+fs*.9,fs,spy?C.coralL:C.tealL,'center',true,true);
  g.globalAlpha=ease((t-.9)/.7);const sc=Math.min(3,H/190);
  if(spy){const mate=G.chars.find(c=>c.role==='spy'&&c!==p);drawSuit(g,W/2-48,H*.5+sc*38,p.col,{s:sc,t:t});drawSuit(g,W/2+56,H*.5+sc*34,mate.col,{s:sc*.8,face:-1,t:t,seed:3});label('仲間　'+mate.name,W/2+56,H*.5+sc*34+20,12,C.coralL,'center',true);}
  else drawSuit(g,W/2,H*.5+sc*38,p.col,{s:sc,t:t});
  g.globalAlpha=ease((t-1.3)/.7);font(g,14);const ls=wrap(g,spy?'正体を隠して研究員を減らせ。妨害とダクトを使いこなせ。':'任務をすべて終えるか、会議で工作員を見つけ出せ。',Math.min(W-48,420));ls.forEach((l,i)=>label(l,W/2,H*.78+i*22,14,C.ink));
  if(t>1.6){g.globalAlpha=.5+.4*Math.sin(t*3);label('タップして開始',W/2,H-36,12,C.sand);hits.push({x:0,y:0,w:W,h:H,cb:startPlay});}
  g.globalAlpha=1;if(t>7)startPlay();}
function startPlay(){if(G.fade.dir>0||G.state!=='role')return;fadeTo(()=>{G.state='play';G.ctx={};setBanner(G.player.role==='crew'?'任務を果たせ':'気づかれずに動け',2.5);});}
function drawResult(){const p=G.player,w=G.win,t=G.rt,crewWin=w.w==='crew',won=(p.role==='crew')===crewWin;
  drawSea(HALL.x+Math.sin(SEA_T*.1)*200,HALL.y,1);g.fillStyle='rgba(4,11,20,.6)';g.fillRect(0,0,W,H);
  const lg=g.createRadialGradient(W/2,H*.3,0,W/2,H*.3,Math.max(W,H)*.6);lg.addColorStop(0,crewWin?'rgba(63,143,138,.25)':'rgba(181,85,63,.22)');lg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=lg;g.fillRect(0,0,W,H);
  const fs=Math.min(48,W*.11,H*.1),ty=Math.max(48,H*.13);
  g.globalAlpha=ease(t/.7);label(crewWin?'研究員の勝利':'工作員の勝利',W/2,ty,fs,crewWin?C.tealL:C.coralL,'center',true,true);
  g.fillStyle=C.sandD;g.fillRect(W/2-fs*2,ty+fs*.7,fs*4,1);
  g.globalAlpha=ease((t-.4)/.7);label(won?'あなたの勝ち':'あなたの負け',W/2,ty+fs*1.2,16,C.sand,'center',true);label(w.why,W/2,ty+fs*1.2+24,13,C.ink);
  const cols=W>640?8:4,rows=8/cols,cw=Math.min(100,(W-24)/cols),top=ty+fs*1.2+52,avail=H-top-128,chH=Math.min(108,avail/rows),sc=Math.min(1.5,chH/70);
  G.chars.forEach((c,i)=>{const cx=W/2+((i%cols)-(cols-1)/2)*cw,cy=top+((i/cols)|0)*chH+chH*.58;g.globalAlpha=ease((t-.7-i*.08)/.5);
    drawSuit(g,cx,cy,c.col,{s:sc,t:G.rt,seed:c.seed});label(c.name+(c.isPlayer?'（あなた）':''),cx,cy+13,c.isPlayer?10:11,C.ink,'center',true);label((c.role==='spy'?'工作員':'研究員')+(c.alive?'':c.ejected?'・追放':'・死亡'),cx,cy+27,10,c.role==='spy'?C.coralL:C.tealL,'center',true);});
  g.globalAlpha=1;
  if(t>1.2){const bw=Math.min(170,(W-36)/2);pill(W/2-bw-6,H-74,bw,52,'タイトルへ',()=>{if(G.fade.dir>0)return;fadeTo(()=>{G.state='title';G.howto=-1;});});pill(W/2+6,H-74,bw,52,'もう一度',()=>{if(G.fade.dir>0)return;fadeTo(()=>{newGame();G.state='role';G.rt=0;});},true);}
}

/* ---------------- メインループと入力 ---------------- */
function update(dt){
  if(G.state==='play')updPlay(dt);else if(G.state==='meet')updMeet(dt);
}
function draw(){
  g.setTransform(DPR,0,0,DPR,0,0);hits=[];
  if(G.state==='title')drawTitle();else if(G.state==='role')drawRole();else if(G.state==='play')drawPlay();else if(G.state==='meet')drawMeet();else if(G.state==='result')drawResult();
  if(G.fade.a>0){g.fillStyle='rgba(4,10,18,'+ease(G.fade.a)+')';g.fillRect(0,0,W,H);}
}
let last=0;
function frame(now){
  const raw=Math.min(.05,Math.max(0,(now-last)/1000)||0);last=now;FDT=raw;SEA_T+=raw;G.rt+=raw;
  const f=G.fade;if(f.dir>0){f.a+=raw*f.sp;if(f.a>=1){f.a=1;const cb=f.cb;f.cb=null;f.dir=-1;f.sp=2.2;if(cb)cb();}}else if(f.dir<0){f.a-=raw*f.sp;if(f.a<=0){f.a=0;f.dir=0;}}
  for(let i=0;i<SPEED;i++)update(raw);
  draw();requestAnimationFrame(frame);
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const x=e.clientX,y=e.clientY;
  if(G.state==='play'&&G.mini){miniPtr('down',x,y);return;}
  for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){h.cb();return;}}
  if(G.state==='play'&&joy.id==null&&x<W*.6){joy.id=e.pointerId;joy.ox=x;joy.oy=y;joy.dx=joy.dy=0;}
});
cv.addEventListener('pointermove',e=>{e.preventDefault();
  if(G.state==='play'&&G.mini){miniPtr('move',e.clientX,e.clientY);return;}
  if(e.pointerId===joy.id){let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const d=Math.hypot(dx,dy);if(d>46){dx*=46/d;dy*=46/d;}joy.dx=dx;joy.dy=dy;}});
const ptrUp=e=>{if(G.state==='play'&&G.mini)miniPtr('up',e.clientX,e.clientY);if(e.pointerId===joy.id){joy.id=null;joy.dx=joy.dy=0;}};
cv.addEventListener('pointerup',ptrUp);cv.addEventListener('pointercancel',ptrUp);
for(const ev of ['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu','selectstart'])document.addEventListener(ev,e=>e.preventDefault(),{passive:false});
window.addEventListener('keydown',e=>{keys[e.key]=true;if((e.key===' '||e.key==='e')&&G.state==='play'&&!G.mini){const p=G.player;act(p.role==='crew'?mainKind():'kill');}});
window.addEventListener('keyup',e=>{keys[e.key]=false;});
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,200));
window.addEventListener('blur',()=>{joy.id=null;joy.dx=joy.dy=0;for(const k in keys)keys[k]=false;});
window.__G=G;
resize();requestAnimationFrame(frame);
</script>
