<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sora no Shiro 空の城へ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700;900&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
/* Layout: a vertical shaft fills the screen; the HUD hangs in the safe area; panels are lamp-lit stone plates. */
:root{
  --sky:#9ed7f0;
  --ink:#3b2a18;
  --ink-soft:#5a4529;
  --gold:#c89a52;
  --ribbon:#3f7fc4;
  --paper:#fdf4df;
  --paper-dim:#d9e8f2;
  --font-display:'Zen Old Mincho','Hiragino Mincho ProN','Yu Mincho',Georgia,serif;
  --font-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--sky);color:#fff;font-family:var(--font-body);
  overflow:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--sky)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;
  justify-content:space-between;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.shade{text-shadow:0 2px 5px rgba(18,38,66,.55)}
.chip{background:rgba(24,44,74,.4);border:1px solid rgba(255,255,255,.3);
  border-radius:12px;padding:9px 13px 10px;backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px)}
.h{font-family:var(--font-display);font-weight:700;line-height:.9;
  font-variant-numeric:tabular-nums;font-size:clamp(32px,9.5vw,50px);color:var(--paper)}
.h small{font-size:.32em;font-weight:400;margin-left:.28em;letter-spacing:.14em;color:#ffe9b0}
.sub{font-size:10.5px;letter-spacing:.22em;color:rgba(255,255,255,.82);margin-top:5px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.best{font-size:10.5px;letter-spacing:.2em;color:rgba(255,255,255,.82);text-align:right}
.best b{display:block;font-family:var(--font-display);font-size:18px;color:#fff;
  font-variant-numeric:tabular-nums;margin-top:3px;letter-spacing:0}
#sound{pointer-events:auto;width:38px;height:38px;border-radius:50%;padding:0;cursor:pointer;
  border:1px solid rgba(255,255,255,.5);background:rgba(24,44,74,.42);color:#fff;
  display:grid;place-items:center;backdrop-filter:blur(2px)}
#sound:focus-visible{outline:2px solid #fff;outline-offset:2px}
#sound svg{width:18px;height:18px;display:block}
.foot{display:flex;flex-direction:column;gap:9px}
.charges{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.2em;
  color:rgba(255,255,255,.85)}
.charges i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.14);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);transition:background .15s,box-shadow .15s}
.charges i.on{background:radial-gradient(circle at 36% 30%,#ffffff,#9fe4ff 52%,#3f9fdd);
  box-shadow:0 0 10px rgba(130,215,255,.7),inset 0 0 0 1px rgba(255,255,255,.75)}
.gauge{height:4px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#cfe6f6,#fff)}
.glab{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.2em;
  color:rgba(255,255,255,.82)}

#panels{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;
  padding:max(20px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-right,0px))}
.card{width:min(100%,380px);box-sizing:border-box;position:relative;overflow:hidden;
  background:linear-gradient(168deg,#fdf5e2,#f3e3c2 62%,#e9d5ad);
  border:1px solid #9d7636;border-radius:7px;padding:26px 24px 22px;color:var(--ink);
  box-shadow:0 20px 46px rgba(18,38,66,.42),inset 0 0 0 3px rgba(255,255,255,.55),
    inset 0 0 0 4.5px var(--gold)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 70% at 50% -10%,rgba(255,255,255,.6),transparent 62%),
    repeating-linear-gradient(97deg,rgba(120,90,40,.035) 0 1px,transparent 1px 5px)}
.title{font-family:var(--font-display);font-weight:900;font-size:clamp(38px,12vw,52px);
  margin:0;line-height:1.08;letter-spacing:.06em;color:var(--ink);
  text-shadow:0 1px 0 rgba(255,255,255,.85)}
.romaji{font-size:10.5px;letter-spacing:.38em;color:#a97c37;margin:11px 0 0;text-transform:uppercase}
.rule{height:1px;margin:17px 0 15px;
  background:linear-gradient(90deg,var(--gold),rgba(200,154,82,0))}
.card p{margin:0 0 10px;font-size:13px;line-height:1.85;color:var(--ink-soft);max-width:34em}
.keys{display:flex;flex-direction:column;gap:8px;margin:15px 0 4px}
.key{display:flex;gap:11px;align-items:baseline;font-size:12.5px;line-height:1.6;color:var(--ink-soft)}
.key span{flex:0 0 auto;font-family:var(--font-display);font-size:12px;color:#fff;
  background:linear-gradient(180deg,#5c9fd8,#2f6fb5);padding:3px 9px;border-radius:4px;
  letter-spacing:.08em;box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.tap{display:flex;align-items:center;gap:10px;margin-top:19px;font-size:12px;
  letter-spacing:.22em;color:#8a6a3c}
.tap i{width:10px;height:10px;border-radius:50%;background:#4a9fdc;flex:0 0 auto;
  box-shadow:0 0 10px rgba(74,159,220,.75);animation:pulse 1.9s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.82)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.tap i{animation:none;opacity:.9}}
.scores{display:flex;gap:26px;flex-wrap:wrap;margin:2px 0}
.score em{display:block;font-style:normal;font-size:9.5px;letter-spacing:.24em;
  color:#9a7a46;margin-bottom:4px}
.score b{font-family:var(--font-display);font-size:clamp(30px,9vw,38px);font-weight:700;
  line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.score b i{font-style:normal;font-size:.36em;font-weight:400;margin-left:.25em;color:#a97c37}
.note{font-size:12px;line-height:1.8;color:var(--ink-soft);margin-top:13px}
.note b{color:#c2561f;font-weight:700}
[hidden]{display:none!important}
</style>
<div id="stage"><canvas id="game"></canvas></div>
<div id="ui">
  <div class="row">
    <div class="chip">
      <div class="h shade"><span id="hgt">0</span><small>m</small></div>
      <div class="sub shade">到　達　高　度</div>
    </div>
    <div class="right">
      <button id="sound" type="button" aria-label="音を切り替える">
        <svg id="ic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path d="M15.8 9.2a4 4 0 010 5.6"/><path d="M18.4 6.8a7.6 7.6 0 010 10.4"/></svg>
        <svg id="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" hidden><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path d="M16.5 10l4 4M20.5 10l-4 4"/></svg>
      </button>
      <div class="best shade chip">最　高<b><span id="best">0</span>m</b></div>
    </div>
  </div>
  <div class="foot chip">
    <div class="charges shade">空 中 で 弾 く <i id="c0"></i><i id="c1"></i></div>
    <div class="glab shade"><span>雲　海</span><span id="wlab">—</span></div>
    <div class="gauge"><i id="wg"></i></div>
  </div>
</div>
<div id="panels">
  <div class="card" id="card-title">
    <h1 class="title">空の城へ</h1>
    <p class="romaji">Sora no Shiro</p>
    <div class="rule"></div>
    <p>雲海がせり上がる谷を、スライムが跳ねて昇っていく。浮島を足場に、鉄輪に弾かれて、空の城の高さへ。頂はない。</p>
    <div class="keys">
      <div class="key"><span>引く</span>画面のどこでも押して引く。引いた逆向きへ飛ぶ。狙っている間、時間はほとんど止まる。</div>
      <div class="key"><span>離す</span>はじける。浮島に乗れば、また引ける。島は下からすり抜けられる。</div>
      <div class="key"><span>鉄輪</span>当たると勢いが増す。結晶を拾うと、空中でもう一度だけはじける。</div>
    </div>
    <div class="tap"><i></i>画面をタップして出発</div>
  </div>
  <div class="card" id="card-over" hidden>
    <h1 class="title" style="font-size:clamp(26px,7.5vw,34px)">雲に飲まれた</h1>
    <div class="rule"></div>
    <div class="scores">
      <div class="score"><em>今　回</em><b><span id="o-h">0</span><i>m</i></b></div>
      <div class="score"><em>最　高</em><b><span id="o-b">0</span><i>m</i></b></div>
    </div>
    <p class="note" id="o-note"></p>
    <div class="tap"><i></i>画面をタップしてもう一度</div>
  </div>
</div>
<script>
(function(){
'use strict';
/* ---------------------------------------------------------------- helpers */
var clamp=function(v,a,b){return v<a?a:v>b?b:v;};
var lerp=function(a,b,t){return a+(b-a)*t;};
var smooth=function(t){return t*t*(3-2*t);};
var quintic=function(t){return t*t*t*(t*(t*6-15)+10);};
function hx(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mix(a,b,t){return [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}
function rgb(c){return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';}
function rgba(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')';}
var SEED=0;
function h1(i,s){var x=Math.sin(i*127.1+s*311.7)*43758.5453;return x-Math.floor(x);}
function vn(y,p,s){var t=y/p,i=Math.floor(t),f=quintic(t-i);return lerp(h1(i,s),h1(i+1,s),f);}

/* ------------------------------------------------------------ the shaft */
var WW=420,R=9,G=1600,VMAX=1250,MAXPULL=150,SLOW=0.25,LSTEP=185,BSTEP=300,SSTEP=240;
function wallL(y){return 22+46*vn(y,430,1.7+SEED)+16*vn(y,150,4.3+SEED);}
function wallR(y){return WW-(22+46*vn(y,430,9.1+SEED)+16*vn(y,150,13.7+SEED));}
function ledge(k){
  if(k<=0)return {y:0,x0:-20,x1:WW+20,floor:true};
  var y=k*LSTEP+h1(k,21.3+SEED)*54;
  if(y>9000&&h1(k,103.1+SEED)<Math.min(0.2,(y-9000)/130000))return null;
  var side=h1(k,31.1+SEED)<0.5?0:1,
      len=(84+h1(k,37.9+SEED)*62)*(1-Math.min(0.34,y/95000)),
      inset=8+h1(k,43.7+SEED)*52,
      x0=side?wallR(y)-inset-len:wallL(y)+inset;
  if(h1(k,71.9+SEED)>0.93){ /* a timber beam spans the whole shaft */
    return {y:y,x0:wallL(y)-6,x1:wallR(y)+6,beam:true};
  }
  return {y:y,x0:x0,x1:x0+len};
}
function bumper(k){
  if(k<1||h1(k,47.3+SEED)>0.68)return null;
  var y=k*BSTEP+h1(k,51.1+SEED)*150,
      l=wallL(y),r=wallR(y);
  return {y:y,x:l+(r-l)*(0.2+h1(k,53.1+SEED)*0.6),r:17,k:k};
}
function sparkPt(k){
  if(k<1||h1(k,61.7+SEED)>0.72)return null;
  var y=k*SSTEP+h1(k,59.3+SEED)*130,
      l=wallL(y),r=wallR(y);
  return {y:y,x:l+(r-l)*(0.16+h1(k,67.3+SEED)*0.68),k:k};
}

/* -------------------------------------------------------- depth palette */
var ZONES=[
 {bg:['#9ed7f0','#cfeaf7','#eef7f0'],rock:'#8a7a62',deep:'#4e4335',grass:'#6fa94a',
  far:'#b9d6e8',cloud:'#ffffff',mote:'#ffffff'},
 {bg:['#4a9ee0','#8fd0f2','#dcf1fb'],rock:'#94836a',deep:'#55483a',grass:'#78bb52',
  far:'#cfe6f4',cloud:'#ffffff',mote:'#ffffff'},
 {bg:['#3b4a85','#e08a5a','#ffd79a'],rock:'#7d6450',deep:'#43342a',grass:'#87904e',
  far:'#e8b78f',cloud:'#ffe6cc',mote:'#ffe9c4'},
 {bg:['#101a3a','#243161','#51608f'],rock:'#4e4e62',deep:'#232534',grass:'#51705a',
  far:'#6c7cac',cloud:'#c9d5ef',mote:'#dfe8ff'}
];
for(var zi=0;zi<ZONES.length;zi++){
  var Z=ZONES[zi];
  Z.bg=[hx(Z.bg[0]),hx(Z.bg[1]),hx(Z.bg[2])];
  Z.rock=hx(Z.rock);Z.deep=hx(Z.deep);Z.grass=hx(Z.grass);
  Z.far=hx(Z.far);Z.cloud=hx(Z.cloud);Z.mote=hx(Z.mote);
}
var ZH=2400;
var PAL={bg:[[0,0,0],[0,0,0],[0,0,0]],rock:[0,0,0],deep:[0,0,0],grass:[0,0,0],
         far:[0,0,0],cloud:[0,0,0],mote:[0,0,0],phase:0};
function palette(y){
  var c=(y/(ZH*4))%1; if(c<0)c+=1;
  var f=c*4,i=Math.floor(f)%4,t=smooth(f-Math.floor(f)),j=(i+1)%4,A=ZONES[i],B=ZONES[j],k;
  for(k=0;k<3;k++)PAL.bg[k]=mix(A.bg[k],B.bg[k],t);
  PAL.rock=mix(A.rock,B.rock,t);PAL.deep=mix(A.deep,B.deep,t);
  PAL.grass=mix(A.grass,B.grass,t);PAL.far=mix(A.far,B.far,t);
  PAL.cloud=mix(A.cloud,B.cloud,t);PAL.mote=mix(A.mote,B.mote,t);
  PAL.phase=c;return PAL;
}

/* ------------------------------------------------------------------ canvas */
var cv=document.getElementById('game'),ctx=cv.getContext('2d',{alpha:false});
var W=0,H=0,DPR=1,sc=1,ox=0;
var skyArt=null,skyKey=-1,vigArt=null,vigKey=-1,glowArt=null,moteArt=null;
function resize(){
  var r=cv.getBoundingClientRect();
  W=Math.max(240,Math.round(r.width));H=Math.max(300,Math.round(r.height));
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  sc=Math.min(W/WW,H/700);ox=(W-WW*sc)/2;
  skyKey=-1;vigKey=-1;
  if(!glowArt){
    glowArt=document.createElement('canvas');glowArt.width=128;glowArt.height=128;
    var g=glowArt.getContext('2d'),rg=g.createRadialGradient(64,64,0,64,64,64);
    rg.addColorStop(0,'rgba(255,255,255,0.95)');
    rg.addColorStop(0.3,'rgba(255,255,255,0.35)');
    rg.addColorStop(0.65,'rgba(255,255,255,0.08)');
    rg.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=rg;g.fillRect(0,0,128,128);
  }
  if(!moteArt){
    moteArt=document.createElement('canvas');moteArt.width=64;moteArt.height=64;
    var m=moteArt.getContext('2d'),mg=m.createRadialGradient(32,32,0,32,32,32);
    mg.addColorStop(0,'rgba(255,255,255,0.7)');
    mg.addColorStop(0.5,'rgba(255,255,255,0.16)');
    mg.addColorStop(1,'rgba(255,255,255,0)');
    m.fillStyle=mg;m.fillRect(0,0,64,64);
  }
}
window.addEventListener('resize',resize);
if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);
function toX(wx){return ox+wx*sc;}
function toY(wy){return H*0.58-(wy-S.camY)*sc;}

/* -------------------------------------------------------------------- audio */
var AU={on:true,ctx:null,ready:false,rum:null,rumG:null,rumF:null};
try{AU.on=localStorage.getItem('hinoko.mute')!=='1';}catch(e){}
function audioInit(){
  if(AU.ready)return;
  var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{
    AU.ctx=new AC();
    var len=AU.ctx.sampleRate*2,buf=AU.ctx.createBuffer(1,len,AU.ctx.sampleRate),
        d=buf.getChannelData(0),last=0,i;
    for(i=0;i<len;i++){var w=Math.random()*2-1;last=last*0.93+w*0.07;d[i]=last*3.2;}
    AU.rum=AU.ctx.createBufferSource();AU.rum.buffer=buf;AU.rum.loop=true;
    AU.rumF=AU.ctx.createBiquadFilter();AU.rumF.type='lowpass';AU.rumF.frequency.value=180;
    AU.rumG=AU.ctx.createGain();AU.rumG.gain.value=0;
    AU.rum.connect(AU.rumF);AU.rumF.connect(AU.rumG);AU.rumG.connect(AU.ctx.destination);
    AU.rum.start();AU.ready=true;
  }catch(e){AU.ready=false;}
}
function tone(f,f2,dur,vol,type){
  if(!AU.ready||!AU.on)return;
  var t=AU.ctx.currentTime,o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(AU.ctx.destination);o.start(t);o.stop(t+dur+0.02);
}
function noiseHit(dur,vol,f0,f1){
  if(!AU.ready||!AU.on)return;
  var t=AU.ctx.currentTime,src=AU.ctx.createBufferSource();
  src.buffer=AU.rum.buffer;src.loop=true;
  var bp=AU.ctx.createBiquadFilter();bp.type='bandpass';
  bp.frequency.setValueAtTime(f0,t);bp.frequency.exponentialRampToValueAtTime(f1,t+dur);
  bp.Q.value=1.1;
  var g=AU.ctx.createGain();g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(bp);bp.connect(g);g.connect(AU.ctx.destination);
  src.start(t);src.stop(t+dur+0.02);
}
function rumble(near){
  if(!AU.ready)return;
  var g=AU.on?clamp(near,0,1)*0.22:0;
  AU.rumG.gain.setTargetAtTime(g,AU.ctx.currentTime,0.25);
  AU.rumF.frequency.setTargetAtTime(120+clamp(near,0,1)*240,AU.ctx.currentTime,0.3);
}

/* -------------------------------------------------------------------- state */
var S={mode:'title',t:0,camY:0,water:-640,best:0,peak:0,charges:1,shake:0,flash:0,
       over:0,slow:1,aiming:false,ax:0,ay:0,cx:0,cy:0,hit:0};
var P={x:WW/2,y:26,vx:0,vy:0,stuck:true,rest:0,sq:0,ang:0};
var parts=[],motes=[],trail=[],taken={},rings={};
try{S.best=parseInt(localStorage.getItem('hinoko.best')||'0',10)||0;}catch(e){}
var EL={h:document.getElementById('hgt'),best:document.getElementById('best'),
  wg:document.getElementById('wg'),wlab:document.getElementById('wlab'),
  c0:document.getElementById('c0'),c1:document.getElementById('c1'),
  cT:document.getElementById('card-title'),cO:document.getElementById('card-over'),
  oh:document.getElementById('o-h'),ob:document.getElementById('o-b'),
  on:document.getElementById('o-note')};
EL.best.textContent=S.best;

function reset(mode){
  SEED=Math.random()*400;
  S.mode=mode;S.t=0;S.water=-640;S.peak=0;S.charges=1;S.shake=0;S.flash=0;S.over=0;
  S.slow=1;S.aiming=false;S.hit=0;
  P.x=WW/2;P.y=26;P.vx=0;P.vy=0;P.stuck=true;P.rest=0;P.sq=0;P.ang=0;
  S.camY=P.y;
  parts.length=0;trail.length=0;taken={};rings={};
  motes.length=0;
  for(var i=0;i<34;i++)motes.push({x:Math.random()*WW,y:Math.random()*1400-200,
    s:0.4+Math.random()*1.1,p:Math.random()*6.28,v:4+Math.random()*12});
  EL.cT.hidden=(mode!=='title');EL.cO.hidden=true;
}

/* -------------------------------------------------------------------- input */
function aimStart(x,y){
  if(S.mode==='title'){reset('play');return;}
  if(S.mode==='over'){if(S.over>0.65)reset('play');return;}
  if(!P.stuck&&S.charges<=0)return;

/* ---------------------------------------------------------------- particles */
function spawn(x,y,vx,vy,life,size,kind,col){
  if(parts.length>130)parts.shift();
  parts.push({x:x,y:y,vx:vx,vy:vy,l:life,m:life,s:size,k:kind,c:col,
    r:Math.random()*6.28,vr:(Math.random()-0.5)*8});

function kick(x,y,dx,dy,pw){

function dust(x,y,n,pw){

/* -------------------------------------------------------------------- physics */
function step(dt){
  if(S.mode==='title'){
    S.camY=lerp(S.camY,P.y+120,Math.min(1,dt*2));
    return;
  }
  var rise=Math.min(300,30+S.peak*0.009);
  S.water+=rise*dt;
  if(P.stuck){
    if(P.rest>0)P.rest-=dt;
    P.sq=lerp(P.sq,0,Math.min(1,dt*8));
  }else{
    P.vy-=G*dt;
    var nx=P.x+P.vx*dt,ny=P.y+P.vy*dt,k,d,lg,landed=false;
    /* walls bounce */
    var L=wallL(ny),Rw=wallR(ny);
    if(nx-R<L){nx=L+R;P.vx=Math.abs(P.vx)*0.46;P.vy*=0.84;
      dust(nx-R,ny,4,120);noiseHit(0.1,0.06,420,160);S.shake=Math.min(8,S.shake+2);}
    else if(nx+R>Rw){nx=Rw-R;P.vx=-Math.abs(P.vx)*0.46;P.vy*=0.84;
      dust(nx+R,ny,4,120);noiseHit(0.1,0.06,420,160);S.shake=Math.min(8,S.shake+2);}
    /* ledges */
    k=Math.round(ny/LSTEP);
    for(d=-1;d<=1&&!landed;d++){
      lg=ledge(k+d);
      if(!lg)continue;
      if(P.vy<=0&&nx>lg.x0-R&&nx<lg.x1+R&&ny-R<=lg.y+9&&P.y-R>=lg.y+2){
        ny=lg.y+9+R;P.vy=0;P.vx=0;P.stuck=true;P.rest=0.1;landed=true;
        S.charges=Math.max(S.charges,1);
        P.sq=-1;
        dust(nx,lg.y+10,6,90);
        tone(180,110,0.14,0.05,'triangle');noiseHit(0.09,0.05,300,120);
        S.shake=Math.min(7,S.shake+1.6);
      }
    }
    /* iron rings */
    var bk=Math.round(ny/BSTEP);
    for(d=-1;d<=1;d++){
      var bp=bumper(bk+d);
      if(!bp)continue;
      var ddx=nx-bp.x,ddy=ny-bp.y,dd=Math.hypot(ddx,ddy);
      if(dd<bp.r+R&&dd>0.01){
        var ux=ddx/dd,uy=ddy/dd,dot=P.vx*ux+P.vy*uy;
        P.vx=(P.vx-2*dot*ux)*1.1;P.vy=(P.vy-2*dot*uy)*1.1;
        var sp=Math.hypot(P.vx,P.vy);
        if(sp<520){P.vx*=520/sp;P.vy*=520/sp;}
        nx=bp.x+ux*(bp.r+R+1.5);ny=bp.y+uy*(bp.r+R+1.5);
        rings[bp.k]=0.5;S.hit=0.4;
        tone(760,0,0.3,0.07,'sine');tone(1140,0,0.22,0.03,'sine');
        for(var q=0;q<10;q++){
          var qa=Math.random()*6.28,qs=80+Math.random()*160;
          spawn(nx,ny,Math.cos(qa)*qs,Math.sin(qa)*qs,0.4,2.5+Math.random()*3,'mote');
        }
        S.shake=Math.min(10,S.shake+3);
      }
    }
    /* sparks */
    var sk=Math.round(ny/SSTEP);
    for(d=-1;d<=1;d++){
      var sp2=sparkPt(sk+d);
      if(!sp2||taken[sp2.k])continue;
      if(Math.hypot(nx-sp2.x,ny-sp2.y)<24){
        taken[sp2.k]=1;S.charges=Math.min(2,S.charges+1);
        tone(880,1320,0.26,0.06,'sine');
        for(var w=0;w<14;w++){
          var wa=Math.random()*6.28,ws=50+Math.random()*170;
          spawn(sp2.x,sp2.y,Math.cos(wa)*ws,Math.sin(wa)*ws,0.5+Math.random()*0.4,
            2+Math.random()*3,'mote');
        }
      }
    }
    P.x=nx;P.y=ny;
    P.sq=lerp(P.sq,0,Math.min(1,dt*5));
    P.ang=Math.atan2(P.vy,P.vx);
    trail.push(P.x,P.y);
    if(trail.length>70)trail.splice(0,2);
  }
  S.peak=Math.max(S.peak,P.y);
  /* drowning */
  if(S.mode==='play'&&P.y-R<S.water){
    S.mode='over';S.over=0;S.flash=1;S.shake=14;S.aiming=false;
    var hm=Math.floor(S.peak/10),rec=hm>S.best;
    if(rec){S.best=hm;try{localStorage.setItem('hinoko.best',String(hm));}catch(e){}}
    EL.best.textContent=S.best;EL.oh.textContent=hm;EL.ob.textContent=S.best;
    EL.on.innerHTML=rec?'<b>最高到達</b>　ここまで昇ったことはなかった。'
      :'あと <b>'+Math.max(1,S.best-hm)+' m</b> で最高に並ぶ。';
    EL.cO.hidden=false;
    for(var s3=0;s3<26;s3++){
      var sa=Math.random()*6.28,ss=40+Math.random()*180;
      spawn(P.x,S.water,Math.cos(sa)*ss,Math.abs(Math.sin(sa))*ss,0.8+Math.random()*0.7,
        4+Math.random()*9,'splash');
    }
    noiseHit(0.5,0.2,600,80);tone(120,60,0.7,0.07,'sine');
    if(AU.ready)AU.rumG.gain.setTargetAtTime(0,AU.ctx.currentTime,0.3);
  }
  /* camera */
  var tgt=P.y+clamp(P.vy*0.2,-70,190);
  if(S.water>tgt-420)tgt=Math.max(tgt,S.water+300);
  S.camY=lerp(S.camY,tgt,Math.min(1,dt*(P.stuck?3.4:5.2)));
  /* fx decay */
  S.shake*=Math.pow(0.004,dt);S.flash*=Math.pow(0.02,dt);S.hit*=Math.pow(0.02,dt);
  for(var i=parts.length-1;i>=0;i--){
    var pa=parts[i];pa.l-=dt;
    if(pa.l<=0){parts.splice(i,1);continue;}
    pa.x+=pa.vx*dt;pa.y+=pa.vy*dt;pa.r+=pa.vr*dt;
    if(pa.k==='mote'){pa.vy+=40*dt;pa.vx*=1-1.9*dt;pa.vy*=1-1.9*dt;}
    else if(pa.k==='dust'){pa.vy-=60*dt;pa.vx*=1-1.6*dt;}
    else if(pa.k==='splash'){pa.vy-=900*dt;pa.vx*=1-0.6*dt;}
  }
  for(var ri in rings){rings[ri]-=dt;if(rings[ri]<=0)delete rings[ri];}
}

}
function vigWash(a){

  if(vigArt.width!==W||vigArt.height!==H){vigArt.width=W;vigArt.height=H;vigKey=-1;}

}
function wallPaths(){
  var stepPx=11,sy,wy,
      pl=new Path2D(),pr=new Path2D(),el=new Path2D(),er=new Path2D(),first=true;
  pl.moveTo(-4,-6);pr.moveTo(W+4,-6);
  for(sy=-6;sy<=H+6;sy+=stepPx){
    wy=S.camY+(H*0.58-sy)/sc;
    var xl=toX(wallL(wy)),xr=toX(wallR(wy));
    pl.lineTo(xl,sy);pr.lineTo(xr,sy);
    if(first){el.moveTo(xl,sy);er.moveTo(xr,sy);first=false;}
    else{el.lineTo(xl,sy);er.lineTo(xr,sy);}
  }
  pl.lineTo(-4,H+6);pl.closePath();
  pr.lineTo(W+4,H+6);pr.closePath();
  return {pl:pl,pr:pr,el:el,er:er};
}
function drawCliffs(p,wp){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,rgb(mix(p.rock,p.deep,0.3)));
  g.addColorStop(0.5,rgb(p.rock));
  g.addColorStop(1,rgb(mix(p.rock,p.deep,0.5)));
  ctx.fillStyle=g;ctx.fill(wp.pl);ctx.fill(wp.pr);
  /* strata and cracks in the cliff face */
  var top=S.camY+(H*0.58)/sc+60,bot=S.camY-(H*0.42)/sc-60,wy,i;
  ctx.lineCap='round';
  for(wy=Math.floor(bot/38)*38;wy<top;wy+=38){
    i=Math.round(wy/38);
    var hh=h1(i,77.3+SEED);
    if(hh>0.7)continue;
    var sy=toY(wy),len=(14+hh*52)*sc,left=h1(i,81.1+SEED)<0.5;
    ctx.strokeStyle=rgba(p.deep,0.38);ctx.lineWidth=Math.max(1,2.2*sc);
    ctx.beginPath();
    if(left){var x=toX(wallL(wy));ctx.moveTo(x-len,sy);ctx.lineTo(x-len*0.15,sy+hh*10*sc);}
    else{var x2=toX(wallR(wy));ctx.moveTo(x2+len,sy);ctx.lineTo(x2+len*0.15,sy+hh*10*sc);}
    ctx.stroke();
  }
  /* the lip catches the light */
  ctx.save();ctx.clip(wp.pl);
  ctx.strokeStyle=rgba(mix(p.rock,[255,240,210],0.55),0.4);
  ctx.lineWidth=30*sc;ctx.stroke(wp.el);
  ctx.restore();
  ctx.save();ctx.clip(wp.pr);
  ctx.strokeStyle=rgba(mix(p.rock,[255,240,210],0.42),0.32);
  ctx.lineWidth=30*sc;ctx.stroke(wp.er);
  ctx.restore();
  /* turf along the lip, and vines hanging from it */
  ctx.strokeStyle=rgb(p.grass);ctx.lineWidth=Math.max(3,9*sc);
  ctx.stroke(wp.el);ctx.stroke(wp.er);
  ctx.strokeStyle=rgba(mix(p.grass,[255,255,255],0.45),0.75);
  ctx.lineWidth=Math.max(1,2*sc);
  ctx.save();ctx.translate(2.6*sc,0);ctx.stroke(wp.el);ctx.restore();
  ctx.save();ctx.translate(-2.6*sc,0);ctx.stroke(wp.er);ctx.restore();
  /* bushes crowding the edge */
  for(wy=Math.floor(bot/72)*72;wy<top;wy+=72){
    i=Math.round(wy/72);
    var bh2=h1(i,141.3+SEED);
    if(bh2>0.52)continue;
    var bleft=h1(i,147.7+SEED)<0.5,
        bx=bleft?toX(wallL(wy))-3*sc:toX(wallR(wy))+3*sc,
        by2=toY(wy),br2=(5+bh2*7)*sc;
    ctx.fillStyle=rgb(mix(p.grass,p.deep,0.3));
    ctx.beginPath();
    ctx.arc(bx,by2,br2,0,6.2832);
    ctx.arc(bx+(bleft?-br2*0.8:br2*0.8),by2+br2*0.4,br2*0.72,0,6.2832);
    ctx.arc(bx+(bleft?-br2*0.2:br2*0.2),by2-br2*0.8,br2*0.62,0,6.2832);
    ctx.fill();
    ctx.fillStyle=rgba(mix(p.grass,[255,255,255],0.4),0.6);
    ctx.beginPath();ctx.arc(bx+(bleft?-br2*0.25:br2*0.25),by2-br2*0.85,br2*0.3,0,6.2832);ctx.fill();
  }
  for(wy=Math.floor(bot/46)*46;wy<top;wy+=46){
    i=Math.round(wy/46);
    var vh=h1(i,131.7+SEED);
    if(vh>0.5)continue;
    var vy=toY(wy),vl=(12+vh*44)*sc,vleft=h1(i,137.3+SEED)<0.5,
        vx=vleft?toX(wallL(wy))+2*sc:toX(wallR(wy))-2*sc,
        sway=Math.sin(S.t*0.9+i)*4*sc;
    ctx.strokeStyle=rgba(mix(p.grass,p.deep,0.3),0.8);
    ctx.lineWidth=Math.max(0.9,1.8*sc);
    ctx.beginPath();ctx.moveTo(vx,vy);
    ctx.quadraticCurveTo(vx+sway*0.4,vy+vl*0.6,vx+sway,vy+vl);ctx.stroke();
    ctx.fillStyle=rgba(mix(p.grass,[255,255,255],0.3),0.8);
    ctx.beginPath();ctx.arc(vx+sway,vy+vl,2.1*sc,0,6.2832);ctx.fill();
  }
}
function drawLamps(p){

  ctx.lineTo(cx2-cw*0.28,base+cw*0.16);ctx.closePath();ctx.fill();
  /* distant isles drifting below it */
  for(i=0;i<6;i++){
    var iy=((h1(i,163.7+SEED)*1700-S.camY*0.17)%1700+1700)%1700-300,
        ix=W*(0.1+h1(i,167.3+SEED)*0.8),

      var s1=pa.s*sc*(0.6+a*0.8);
      ctx.globalAlpha=a*0.85;
      ctx.drawImage(moteArt,px-s1*2,py-s1*2,s1*4,s1*4);
    }else if(pa.k==='dust'){
      ctx.globalAlpha=a*0.3;ctx.fillStyle=rgb(mix(p.rock,p.cloud,0.45));
      ctx.beginPath();ctx.arc(px,py,pa.s*sc*(1.5-a*0.5),0,6.2832);ctx.fill();
    }else{
      ctx.globalAlpha=a*0.6;ctx.fillStyle='rgba(255,255,255,1)';
      ctx.beginPath();ctx.arc(px,py,pa.s*sc*a,0,6.2832);ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  drawWater(p);
  if(S.mode!=='over')drawEmber(p);
  drawAim(p);
  ctx.restore();
  var near=clamp(1-(P.y-S.water)/900,0,1);
  ctx.drawImage(vigWash(0.1+near*0.26+(S.aiming?0.1:0)),0,0);
  if(S.flash>0.01){
    ctx.fillStyle='rgba(255,255,255,'+(S.flash*0.6).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
  }
}
/* ----------------------------------------------------------------------- hud */
var hudN=0;
function hud(){
  if((hudN++&1)===0)return;
  EL.h.textContent=Math.floor(S.peak/10);
  var gap=P.y-S.water;
  EL.wg.style.width=clamp(100-gap/9,0,100).toFixed(1)+'%';
  EL.wlab.textContent=S.mode==='play'?(Math.max(0,Math.floor(gap/10))+'m 下'):'—';
  EL.c0.className=S.charges>=1?'on':'';
  EL.c1.className=S.charges>=2?'on':'';
  rumble(clamp(1-(P.y-S.water)/700,0,1)*(S.mode==='play'?1:0));
}
/* ---------------------------------------------------------------------- loop */
var last=0,acc=0,STEP=1/120;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last){last=ts;return;}
  var dt=(ts-last)/1000;last=ts;
  if(document.hidden||dt<=0)return;
  if(dt>0.05)dt=0.05;
  S.t+=dt;
  var want=S.mode==='over'?0.25:(S.aiming?SLOW:1);
  S.slow+=(want-S.slow)*Math.min(1,dt*(S.aiming?14:8));
  if(S.mode==='over')S.over+=dt;
  acc+=dt*S.slow;
  var n=0;
  while(acc>=STEP&&n<9){step(STEP);acc-=STEP;n++;}
  if(acc>0.4)acc=0;
  draw();hud();
}
window.__hinoko={S:S,P:P,ledge:function(k){return ledge(k);},
  wallL:function(y){return wallL(y);},wallR:function(y){return wallR(y);},
  LSTEP:LSTEP,VMAX:VMAX,MAXPULL:MAXPULL,G:G,
  toX:function(x){return toX(x);},toY:function(y){return toY(y);}};
function boot(data){
  if(data&&data.best&&data.best>S.best){S.best=data.best;EL.best.textContent=S.best;}
  resize();reset('title');requestAnimationFrame(frame);
}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)
  window.claude.hot.snapshot(function(){return {best:S.best};});
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);
else boot({});
})();
</script>
