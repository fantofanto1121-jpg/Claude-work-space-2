<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ワールド生成</title>
<style>
  :root {
    --bg: #1c1d1f; --panel: #242528; --line: #35373b; --text: #d6d3cc; --muted: #8e8b84;
    --accent: #8ea59b; --field: #1d1e21; --press: #303236;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.5 system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif; }
  #app { display: flex; height: 100%; }
  aside { width: 268px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
    overflow-y: auto; padding: 16px 16px 24px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 14px; letter-spacing: .04em; }
  .group { border-top: 1px solid var(--line); padding: 12px 0 10px; }
  .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .row > label { color: var(--muted); font-size: 12px; min-width: 34px; }
  input[type=text], input[type=number], select {
    width: 100%; min-width: 0; background: var(--field); color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 5px 7px; font: inherit; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  button { background: var(--field); color: var(--text); border: 1px solid var(--line); border-radius: 4px;
    padding: 5px 9px; font: inherit; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: #4a4d52; }
  button:active { background: var(--press); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .seg.three { grid-template-columns: 1fr 1fr 1fr; }
  .seg button.on { border-color: var(--accent); color: #eef0ec; background: #2c302e; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 132px; margin: 4px 0 8px; }
  .pad button { padding: 4px 0; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .val { min-width: 42px; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
  .help { color: var(--muted); font-size: 12px; line-height: 1.7; }
  main { position: relative; flex: 1; min-width: 0; background: #151618; }
  canvas { position: absolute; inset: 0 0 28px 0; width: 100%; height: calc(100% - 28px); display: block; }
  #c2d { cursor: grab; image-rendering: pixelated; }
  #c2d.drag, #c3d.drag { cursor: grabbing; }
  #c3d { cursor: grab; }
  #status { position: absolute; left: 0; right: 0; bottom: 0; height: 28px; display: flex; justify-content: space-between;
    align-items: center; padding: 0 12px; background: var(--panel); border-top: 1px solid var(--line);
    font-size: 12px; font-variant-numeric: tabular-nums; }
  #hover { color: var(--text); }
  #progress { color: var(--muted); }
  .seg .wide { grid-column: span 2; }
  #cross { position: absolute; left: 50%; top: calc(50% - 14px); width: 18px; height: 18px; margin: -9px 0 0 -9px;
    pointer-events: none; mix-blend-mode: difference; }
  #cross::before, #cross::after { content: ""; position: absolute; background: #e8e8e8; }
  #cross::before { left: 8px; top: 0; width: 2px; height: 18px; }
  #cross::after { top: 8px; left: 0; height: 2px; width: 18px; }
  #walkCard { position: absolute; left: 50%; top: calc(50% - 14px); transform: translate(-50%, -50%); width: min(380px, calc(100% - 32px));
    background: rgba(28, 29, 31, 0.9); border: 1px solid var(--line); border-radius: 6px; padding: 18px 20px; cursor: pointer; }
  .wc-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--text); }
  .keys { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; font-size: 12.5px; }
  .keys dt { color: var(--accent); font-variant-numeric: tabular-nums; }
  .keys dd { margin: 0; color: var(--muted); }
  .hide { display: none !important; }
  @media (max-width: 720px) {
    #app { flex-direction: column; }
    aside { width: auto; max-height: 46%; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>ワールド生成</h1>

    <div class="group">
      <div class="label">シード</div>
      <div class="row"><input id="seed" type="text" value="7" spellcheck="false"><button id="apply">生成</button></div>
    </div>

    <div class="group">
      <div class="label">次元</div>
      <div class="seg three" id="dims">
        <button data-v="overworld">地上</button><button data-v="nether">ネザー</button><button data-v="end">エンド</button>
      </div>
    </div>

    <div class="group">
      <div class="label">表示</div>
      <div class="seg" id="modes">
        <button data-v="top">地形図</button><button data-v="slice">水平断面</button>
        <button data-v="section">縦断面</button><button data-v="3d">立体</button>
        <button data-v="walk" id="walkBtn" class="wide hide">歩く</button>
      </div>
    </div>

    <div class="group" id="g-slice">
      <div class="label">断面の高さ</div>
      <div class="row"><input id="sliceY" type="range" min="-64" max="319" step="1"><span class="val" id="sliceYv"></span></div>
    </div>

    <div class="group" id="g-axis">
      <div class="label">縦断面の向き</div>
      <div class="seg" id="axes"><button data-v="0">東西（X）</button><button data-v="1">南北（Z）</button></div>
    </div>

    <div class="group">
      <div class="label">表示範囲の中心</div>
      <div class="row"><label>X</label><input id="cx" type="number" step="1"><label>Z</label><input id="cz" type="number" step="1"></div>
      <div class="row"><button id="go" style="flex:1">移動</button><button id="origin" style="flex:1">原点へ</button></div>
      <div class="pad" id="g-pad">
        <span></span><button data-m="0,-1">北</button><span></span>
        <button data-m="-1,0">西</button><span></span><button data-m="1,0">東</button>
        <span></span><button data-m="0,1">南</button><span></span>
      </div>
      <div id="g-zoom">
        <div class="label">拡大率</div>
        <div class="row"><input id="zoom" type="range" min="0" max="7" step="1"><span class="val" id="zoomv"></span></div>
      </div>
      <div id="g-size" class="hide">
        <div class="label">立体の範囲（一辺のブロック数）</div>
        <div class="row"><select id="size3d"><option>64</option><option>96</option><option>128</option><option>192</option></select></div>
      </div>
    </div>

    <div class="group" id="g-range">
      <div class="label">表示範囲の上下</div>
      <div class="row"><label>下端</label><input id="yMin" type="number"><label>上端</label><input id="yMax" type="number"></div>
    </div>

    <div class="group">
      <button id="png" style="width:100%">PNG で保存</button>
    </div>

    <div class="group help" id="help"></div>
  </aside>
  <main>
    <canvas id="c2d"></canvas>
    <canvas id="c3d" class="hide"></canvas>
    <div id="cross" class="hide"></div>
    <div id="walkCard" class="hide">
      <div class="wc-title" id="wcTitle">クリックして歩き始める</div>
      <dl class="keys">
        <dt>マウス</dt><dd>視点を動かす</dd>
        <dt>W A S D</dt><dd>前・左・後ろ・右へ歩く</dd>
        <dt>スペース</dt><dd>ジャンプ（水の中では上がる）</dd>
        <dt>左 Shift</dt><dd>スニーク（端から落ちない）</dd>
        <dt>左 Ctrl</dt><dd>ダッシュ（W の 2 度押しでも）</dd>
        <dt>Esc</dt><dd>マウスを離して止まる</dd>
      </dl>
    </div>
    <div id="status"><span id="hover">&nbsp;</span><span id="progress"></span></div>
  </main>
</div>
<script src="js/rng.js"></script>
<script src="js/noise.js"></script>
<script src="js/textures.js"></script>
<script src="js/blocks.js"></script>
<script src="js/overworld.js"></script>
<script src="js/nether.js"></script>
<script src="js/end.js"></script>
<script src="js/world.js"></script>
<script src="js/paint.js"></script>
<script src="js/render3d.js"></script>
<script src="js/walk.js"></script>
<script src="js/main.js"></script>
</body>
</html>
